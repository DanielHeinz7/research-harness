<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research harness — canvas</title>
<style>
  /* Tokens taken from the DSI-WI4 SuperApp (read-only reference, nothing there
     was changed):
     - app/globals.css :root            -> background/surface/text/action/line/border hex values
     - docs/ui-design-direction.md
       "Color roles"                    -> status hex values (#246044/#75500F/#4D655A), the
                                            gradient, focus ring (3px/4px offset), shadow recipes
       "Typography"                     -> local font stack, tabular numerals for ids/counts
       "Density and spacing"            -> the 8/16/24/32/40 scale
       "Shape language"                 -> 22px card radius, 999px pill radius, 12px input radius
     - components/status-badge.tsx      -> never colour alone (reused here for the soft status cues)
     - components/apps/apps-hub.tsx,
       components/apps/app-tile.tsx     -> hub card grid, now the poster grid
       components/site-header.tsx       -> segmented top navigation, brand mark
       components/apps/app-detail.tsx   -> "element in focus" header/body layout, now the field view

     The session view (story-first presentation, decided 2026-09-30): a Poster that
     shows the whole paper on one screen, "To talk about", "History", and a field
     view per element. Read like the paper's argument, not a form: statements as
     prose, status as a visible word and ownership label, no counters, no seal status, no "DISCOVERY", no
     visible `src:` text; gaps invite rather than accuse. The write paths
     (accept/stated/comment, expectedHash, the single-use code exchange) are the
     data model's and unchanged. The poster fits 1440x900 without scrolling; the
     side rail is hidden there; the footer is print-only. */
  :root {
    color-scheme: light;
    --light-bg: #ebf2eb;
    --bg: var(--light-bg);
    --light-surface: #ffffff;
    --surface: var(--light-surface);
    --light-ink: #193c31;
    --ink: var(--light-ink);
    --light-ink-soft: #354f42;
    --ink-soft: var(--light-ink-soft);
    --light-action: #154b38;
    --action: var(--light-action);
    --light-action-ink: #ffffff;
    --action-ink: var(--light-action-ink);
    --action-hover: #0f3a2b;
    --secondary: #dfeadd;
    --accent-surface: #dbedb0;
    --accent-ink: #193c31;
    --line: #7d9688;
    --light-border: #cdddca;
    --border: var(--light-border);
    --light-icon-grad-start: #20583f;
    --icon-grad-start: var(--light-icon-grad-start);
    --suggestion-tint: rgba(117, 80, 15, 0.1);
    --light-suggestion-ink: #5c400e;
    --suggestion-ink: var(--light-suggestion-ink);
    --shadow-modal: 0 24px 60px rgba(25, 60, 49, 0.25);
    --warning-border: rgba(117, 80, 15, 0.35);
    --warning-bg: rgba(117, 80, 15, 0.08);
    --shadow-inset: inset 0 1px 2px rgba(25, 60, 49, 0.06);
    --shadow-button: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 2px 4px rgba(25, 60, 49, 0.12);
    --backdrop: rgba(25, 60, 49, 0.35);
    --space-4: 4px;
    --space-10: 10px;
    --space-16: 16px;
    --space-12: 12px;
    --space-neg-1: -1px;
    --space-24: 24px;
    --space-14: 14px;
    --space-2: 2px;
    --space-3: 3px;
    --space-8: 8px;
    --space-30: 30px;
    --space-5: 5px;
    --space-20: 20px;
    --space-1: 1px;
    --space-6: 6px;
    --space-neg-2: -2px;
    --space-18: 18px;
    --space-22: 22px;
    --space-26: 26px;
    --space-neg-6: -6px;
    --space-36: 36px;
    --shadow-raised: 0 2px 6px rgba(25, 60, 49, 0.1), inset 0 0 0 1px rgba(25, 60, 49, 0.05);
    --r-card: 22px;
    --r-pill: 999px;
    --r-input: 12px;
    --r-icon: 12px;
    --font-ui: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
    --font-num: Arial, Helvetica, sans-serif;
    /* Stable roles at the desk, growing with the shared screen. */
    --type-label: clamp(0.875rem, 0.125rem + 0.833333vw, 1.125rem);
    --type-body: clamp(1rem, 0.25rem + 0.833333vw, 1.25rem);
    --type-heading: clamp(1.125rem, 0.625rem + 0.65vw, 1.5rem);
    --type-title: clamp(1.5rem, 0.625rem + 1.5vw, 2.5rem);
    --space-tight: clamp(0.25rem, 0.2rem + 0.15vw, 0.375rem);
    --space-group: clamp(0.75rem, 0.4rem + 0.5vw, 1rem);
    --space-card: clamp(1rem, 0.75rem + 0.2vw, 1.125rem);
    --space-page: 2rem;
    --space-stage: clamp(1rem, 0.5rem + 1vw, 2rem);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #12241d;
      --surface: #1a3027;
      --ink: #e5f3e9;
      --ink-soft: #c0d6c8;
      --action: #b5edcf;
      --action-ink: #102b21;
      --action-hover: #c9f6de;
      --secondary: #294536;
      --accent-surface: #354a29;
      --accent-ink: #e5f3e9;
      --line: #87a594;
      --border: #4b6858;
      --icon-grad-start: #a4dbb8;
      --suggestion-tint: rgba(240, 216, 163, 0.08);
      --suggestion-ink: #f0d8a3;
      --warning-border: rgba(240, 216, 163, 0.35);
      --warning-bg: rgba(240, 216, 163, 0.08);
      --backdrop: rgba(0, 0, 0, 0.6);
      --shadow-modal: 0 24px 60px rgba(0, 0, 0, 0.4);
      --shadow-raised: 0 2px 6px rgba(0, 0, 0, 0.2);
      --shadow-inset: inset 0 1px 2px rgba(0, 0, 0, 0.1);
      --shadow-button: 0 2px 4px rgba(0, 0, 0, 0.15);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font-family: var(--font-ui);
    font-size: var(--type-body);
    color: var(--ink);
    background: var(--bg);
    line-height: 1.55;
  }
  h1, h2, h3, h4 { line-height: 1.25; margin: 0; font-family: var(--font-ui); }
  button, input, textarea { font-family: inherit; }
  button:focus-visible, a:focus-visible, summary:focus-visible, input:focus-visible, textarea:focus-visible,
  [tabindex]:focus-visible {
    outline: 3px solid var(--action);
    outline-offset: var(--space-4);
  }

  .segment { text-decoration: none; display: inline-flex; align-items: center; }
  .load-message { padding: var(--space-24); }
  .field-discussion-title { color: var(--ink); font-weight: 700; }
  .comment-error { color: var(--suggestion-ink); font-weight: 700; }
  .comment-error:empty { display: none; }
  :focus-visible { scroll-margin: var(--space-12); }
  textarea, input { caret-color: var(--action); }
  ::selection { background: var(--accent-surface); color: var(--accent-ink); }

  #notice {
    flex: 0 0 auto;
    z-index: 30;
    background: var(--ink);
    color: var(--surface);
    padding: var(--space-10) var(--space-16);
    justify-content: space-between;
    align-items: center;
    gap: var(--space-16);
  }
  #notice[hidden] { display: none; }
  #notice:not([hidden]) { display: flex; }
  .notice-icon { font-size: 1rem; }
  #notice button:focus-visible { outline-color: var(--surface); }
  #notice button {
    background: transparent;
    color: var(--surface);
    border: 1px solid var(--surface);
    border-radius: var(--r-pill);
    padding: var(--space-4) var(--space-12);
    cursor: pointer;
    font-weight: 700;
    font-size: var(--type-label);
  }

  #app { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: var(--space-neg-1);
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .notices-banner {
    flex: 0 0 auto;
    margin: var(--space-12) var(--space-24) 0;
    padding: var(--space-14) var(--space-16);
    border: 1px solid var(--warning-border);
    background: var(--warning-bg);
    border-radius: var(--r-input);
    color: var(--suggestion-ink);
  }
  .notices-banner p { margin: var(--space-2) 0; font-size: var(--type-label); }

  #topbar {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-16);
    padding: var(--space-12) var(--space-24);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  #brand { display: flex; align-items: center; gap: var(--space-10); font-weight: 700; color: var(--ink); }
  .brand-mark {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: var(--space-3);
    width: 26px;
    height: 26px;
  }
  .brand-mark i {
    display: block;
    border-radius: 4px;
    background: linear-gradient(145deg, var(--icon-grad-start), var(--action));
    font-style: normal;
  }
  .brand-text { font-size: var(--type-body); }
  .brand-sep { color: var(--ink-soft); font-weight: 400; }

  #view-tabs {
    display: flex;
    flex-wrap: wrap;
    max-width: 100%;
    gap: var(--space-4);
    padding: var(--space-4);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 15px;
    box-shadow: var(--shadow-inset);
  }
  .segment {
    min-height: 44px;
    border: 0;
    background: transparent;
    color: var(--ink-soft);
    font-size: var(--type-label);
    font-weight: 500;
    padding: var(--space-8) var(--space-16);
    border-radius: 11px;
    cursor: pointer;
    white-space: nowrap;
  }
  .segment.active {
    background: var(--surface);
    color: var(--action);
    font-weight: 700;
    box-shadow: var(--shadow-raised);
  }

  #body-shell { flex: 1 1 auto; min-height: 0; min-width: 0; display: flex; }
  /* Point 1: the side rail repeats the poster's own nine cards, so it is
     wasted width there; #stage naturally reflows to the freed space. Other
     views (element, agenda, history) keep it — it is how a reader gets from
     one field to another once they are past the overview. */
  #body-shell.poster-active #rail,
  #body-shell.compare-active #rail { display: none; }

  .skip-link {
    position: absolute;
    left: 12px;
    top: -60px;
    z-index: 50;
    background: var(--action);
    color: var(--action-ink);
    padding: var(--space-10) var(--space-16);
    border-radius: var(--r-input);
    font-weight: 700;
    font-size: var(--type-label);
    text-decoration: none;
    transition: top 0.12s ease;
  }
  .skip-link:focus { top: 12px; }

  #rail {
    flex: 0 0 280px;
    overflow-y: auto;
    padding: var(--space-16);
    background: var(--bg);
    border-right: 1px solid var(--border);
  }
  .rail-label {
    margin: 0 var(--space-4) var(--space-10);
    font-size: var(--type-label);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
  }
  .rail-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-8); }
  .rail-card {
    width: 100%;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-input);
    padding: var(--space-10) var(--space-12);
    cursor: pointer;
  }
  .rail-card.active { border-color: var(--action); box-shadow: 0 0 0 1px var(--action); }
  .rail-card-accent { border-color: var(--action); }
  .rail-top { display: flex; align-items: center; gap: var(--space-8); }
  .rail-question { font-size: var(--type-label); font-weight: 600; color: var(--ink); }
  .rail-term { font-size: var(--type-label); color: var(--ink-soft); padding-left: var(--space-30); }
  /* Point 8: a colour-only dot fails "not by colour alone"; the badge carries
     its own count as text, so it reads without hover or focus. */
  .rail-totalk-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 18px;
    height: 18px;
    padding: 0 var(--space-5);
    border-radius: var(--r-pill);
    background: var(--suggestion-tint);
    color: var(--suggestion-ink);
    font-size: var(--type-label);
    font-weight: 700;
    margin-left: auto;
  }

  .num-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 24px;
    height: 24px;
    padding: 0 var(--space-5);
    border-radius: var(--r-icon);
    background: linear-gradient(145deg, var(--icon-grad-start), var(--action));
    color: var(--action-ink);
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: var(--type-label);
    flex: 0 0 auto;
  }

  #stage { flex: 1 1 auto; min-height: 0; min-width: 0; overflow-y: auto; overflow-wrap: anywhere; padding: var(--space-stage); }
  /* Keep the poster's own bottom padding small so the whole paper sits on one
     1440x900 screen without a scroll bar. */
  #body-shell.poster-active #stage { display: flex; flex-direction: column; padding-bottom: var(--space-8); }

  .view { display: none; }
  .view.active { display: block; }
  .view-head { margin-bottom: var(--space-20); }
  .view-head h1:not(.field-question-lg) { font-size: var(--type-heading); font-weight: 700; color: var(--ink); letter-spacing: -0.01em; }
  .view-sub { margin: var(--space-4) 0 0; font-size: var(--type-label); color: var(--ink-soft); }

  /* -- Poster ------------------------------------------------------ */
  #poster.active { display: flex; flex-direction: column; flex: 1 0 auto; min-height: 0; margin-bottom: 0; }
  .poster-head { margin-bottom: var(--space-group); max-width: 80rem; }
  .poster-eyebrow { margin: 0; font-size: var(--type-label); color: var(--ink-soft); }
  .poster-title { margin: var(--space-1) 0 0; font-size: var(--type-title); font-weight: 700; color: var(--ink); letter-spacing: -0.01em; }

  /* Point 1: every card is short enough (one heading, one lead sentence, one
     link) that all nine fit above the fold at 1440x900. The row label is its
     own grid item now — spanning the full row for real, not nested inside
     the first card's box, which used to push that card's content 14px below
     its row-mates (SQ-111's "visual quality" note). */
  .poster-grid {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    flex: 1;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(3, auto auto);
    gap: var(--space-tight) var(--space-group);
    align-items: stretch;
  }
  .poster-row-label {
    grid-column: 1 / -1;
    font-size: var(--type-label);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    margin: var(--space-6) 0 var(--space-neg-2);
  }
  .poster-row-label:first-child { margin-top: 0; }

  .field-card {
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: var(--space-tight);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    padding: var(--space-card);
  }

  .field-eyebrow { display: flex; align-items: center; gap: var(--space-8); }
  .field-term { font-size: var(--type-label); color: var(--ink-soft); }

  .field-question {
    margin: 0;
    font-size: var(--type-heading);
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.005em;
    line-height: 1.3;
  }
  .field-question-lg { font-size: var(--type-title); }

  .field-body { font-size: var(--type-body); color: var(--ink); }
  .field-body p, .field-para { margin: 0 0 var(--space-10); }
  .field-body p:last-child, .field-para:last-child { margin-bottom: 0; }

  /* Point 1: the poster card's one complete sentence — never clamped, never
     faded mid-thought. */
  .field-lead { margin: 0; font-size: var(--type-body); line-height: 1.45; color: var(--ink); }

  /* Point 8: a heading plus a link, not one giant button around the card. */
  .field-foot {
    margin-top: auto;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: var(--space-2) var(--space-12);
  }
  .field-more {
    min-height: 44px;
    padding: var(--space-4) 0;
    background: none;
    border: 0;
    font-size: var(--type-label);
    font-weight: 700;
    color: var(--action);
    cursor: pointer;
  }
  .field-more:hover, .field-more:focus-visible { text-decoration: underline; }

  /* A quiet line at the card's foot, not a badge: plain words, the arrow is
     decoration. It states a count in text, so it never relies on colour. */
  .field-totalk {
    min-height: 44px;
    padding: var(--space-4) 0;
    background: none;
    border: 0;
    font-size: var(--type-label);
    font-weight: 500;
    color: var(--ink-soft);
    cursor: pointer;
    text-align: right;
  }
  .field-totalk:hover, .field-totalk:focus-visible { color: var(--action); text-decoration: underline; }
  .agenda-list > li:focus { outline: none; }
  .agenda-list > li { scroll-margin-top: var(--space-16); }

  .field-gap { color: var(--ink-soft); }
  .field-gap-question { font-style: normal; }
  .field-gap-note { font-style: italic; }
  .field-para.field-gap {
    border-left: 2px dashed var(--line);
    padding-left: var(--space-10);
  }

  /* Ownership is explicit in words and in the edge treatment: solid for
     authors, dashed for model proposals. The word stays visible in print and
     on a projector; no hover, colour or extra tab stop is needed. */
  .status-label {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: var(--space-2) var(--space-8);
    width: fit-content;
    max-width: 100%;
    margin-bottom: var(--space-4);
    padding: var(--space-2) var(--space-8);
    border: 1px solid var(--ink);
    border-radius: 4px;
    background: var(--surface);
    color: var(--ink);
    font-size: var(--type-label);
    line-height: 1.4;
    font-style: normal;
  }
  .status-label-model { border-style: dashed; }
  .status-word { font-weight: 700; }
  .status-owner { border-left: 1px solid currentColor; padding-left: var(--space-8); }

  .src-ref { font-size: var(--type-label); color: var(--ink-soft); }
  .src-ref a { color: var(--ink-soft); text-decoration: underline; text-underline-offset: 2px; }
  .entry-note, .entry-by { display: block; margin-top: var(--space-3); font-size: var(--type-label); color: var(--ink-soft); }

  .field-totalk-full { margin-top: var(--space-20); }
  .totalk-list { list-style: none; margin: var(--space-8) 0 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-10); }
  .totalk-item {
    background: var(--bg);
    border-radius: var(--r-input);
    padding: var(--space-10) var(--space-14);
    font-size: var(--type-label);
    color: var(--ink);
  }

  .source-key-wrap { margin-top: var(--space-18); }
  .source-key { font-size: var(--type-label); color: var(--ink-soft); border-top: 1px solid var(--border); padding-top: var(--space-10); margin: 0; }
  .source-key li { margin-bottom: var(--space-3); }
  .source-key a { color: var(--ink-soft); }
  #stage a { display: inline-block; min-width: 24px; min-height: 24px; }

  /* -- To talk about (was: Agenda) ------------------------------------ */
  .agenda-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-12); }
  .agenda-item-open {
    width: 100%;
    text-align: left;
    cursor: pointer;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    padding: var(--space-16) var(--space-18);
  }
  .agenda-item-head { display: flex; align-items: center; gap: var(--space-10); margin-bottom: var(--space-6); }
  .agenda-item-title { font-size: var(--type-body); font-weight: 700; color: var(--ink); }
  .agenda-findings { margin: 0; padding-left: var(--space-18); color: var(--ink-soft); font-size: var(--type-body); }
  .agenda-findings li { margin-bottom: var(--space-4); }

  .agenda-gaps { margin-top: var(--space-group); color: var(--ink); }
  .agenda-gaps > summary { font-weight: 700; }
  .agenda-gaps summary { cursor: pointer; padding: var(--space-10) 0; }
  .agenda-gap-count { font-size: var(--type-label); font-weight: 400; color: var(--ink-soft); }
  .agenda-gap-fields { list-style: none; margin: var(--space-8) 0 0; padding: 0; }
  .agenda-gap-field { border-top: 1px solid var(--border); }
  .agenda-gap-field .num-badge { margin: 0 var(--space-8); }
  .agenda-gap-list { list-style: none; margin: var(--space-8) 0 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-8); }
  .agenda-gap-item {
    width: 100%;
    text-align: left;
    cursor: pointer;
    background: transparent;
    border: 0;
    border-radius: var(--r-input);
    padding: var(--space-10) var(--space-14);
    font-size: var(--type-body);
    color: var(--ink-soft);
  }
  .agenda-gap-item:hover { background: var(--surface); }

  /* -- Field (single) ------------------------------------------------- */
  .element-nav { display: flex; justify-content: space-between; margin-bottom: var(--space-12); gap: var(--space-8); }
  .ghost-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink-soft);
    border-radius: var(--r-pill);
    padding: var(--space-6) var(--space-14);
    font-size: var(--type-label);
    font-weight: 600;
    cursor: pointer;
  }
  .field-head { margin-bottom: var(--space-8); }
  .field-body-full {
    margin-top: var(--space-14);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    padding: var(--space-22) var(--space-26);
    font-size: var(--type-body);
    max-width: 70ch;
  }
  .field-body-full .field-para { margin-bottom: var(--space-14); }

  .stmt-actions { display: inline-flex; flex-wrap: wrap; align-items: center; gap: var(--space-6); margin-left: var(--space-6); vertical-align: middle; }
  .action-btn {
    border-radius: var(--r-pill);
    padding: var(--space-5) var(--space-12);
    font-size: var(--type-label);
    font-weight: 700;
    cursor: pointer;
    border: 1px solid var(--action);
  }
  .action-btn-primary {
    background: var(--action);
    color: var(--action-ink);
    box-shadow: var(--shadow-button);
  }
  .action-btn-primary:hover { background: var(--action-hover); }
  .action-btn-outline { background: transparent; color: var(--action); }
  .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .comment-form {
    margin: var(--space-22) 0 0;
    padding: var(--space-18) var(--space-24);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    max-width: 70ch;
  }
  .comment-form label { display: block; margin-bottom: var(--space-10); font-size: var(--type-label); font-weight: 600; color: var(--ink-soft); }
  .comment-form textarea {
    display: block;
    width: 100%;
    min-height: 4.5rem;
    margin-top: var(--space-6);
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: var(--r-input);
    padding: var(--space-10) var(--space-12);
    font-size: var(--type-label);
    color: var(--ink);
  }
  .comment-form input[type="text"] {
    margin-top: var(--space-6);
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: var(--r-input);
    padding: var(--space-8) var(--space-12);
    font-size: var(--type-label);
    color: var(--ink);
    width: 100%;
    max-width: 24rem;
  }

  /* -- History (was: decision log) ------------------------------------ */
  .by-filter { display: flex; flex-wrap: wrap; gap: var(--space-8); margin-bottom: var(--space-16); }
  .by-filter button[aria-pressed="true"] { background: var(--surface); border-color: var(--ink-soft); color: var(--ink); }
  .session-divider { border-top: 1px solid var(--border); padding-top: var(--space-12); color: var(--ink-soft); font-size: var(--type-label); }
  .merge-line { margin: 0; color: var(--ink-soft); font-size: var(--type-label); }
  .history-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-12); max-width: 70ch; }
  .history-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    padding: var(--space-14) var(--space-18);
  }
  .history-meta { font-size: var(--type-label); color: var(--ink-soft); margin: 0 0 var(--space-6); }
  .history-body { margin: 0; color: var(--ink); font-size: var(--type-body); }
  /* The notice banner's amber, carried to the entry it is about. */
  .seal-flag { font-size: var(--type-label); color: var(--suggestion-ink); margin: 0 0 var(--space-6); }
  .notices-banner .seq-link { color: inherit; }
  .seq-link {
    min-width: 24px;
    min-height: 24px;
    padding: 0;
    background: none;
    border: 0;
    font: inherit;
    color: var(--action);
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
  }

  /* -- Framings (the variant comparison) --------------------------------
     The poster's own cards, one column per framing and one row per field. A
     field whose text differs between framings carries a "Differs" tag and the
     accent edge the poster gives its open field; a field that reads the same
     in every framing loses its shadow and fades to the muted ink. The column
     heads stay in view while the rows scroll, so "Choose" is always at hand. */
  .cmp-grid {
    display: grid;
    grid-template-columns: repeat(var(--k, 3), minmax(15rem, 1fr));
    gap: var(--space-6) var(--space-12);
    align-items: stretch;
  }
  /* The margin and padding cancel out, and widen each head's background over
     the column gap so a card scrolling under the heads is not seen between them. */
  .cmp-head { position: static; z-index: 2; margin: 0 var(--space-neg-6); padding: 0 var(--space-6) var(--space-6); background: var(--bg); }
  .cmp-head-box {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: var(--space-2);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    padding: var(--space-10) var(--space-16) var(--space-12);
  }
  .cmp-name { font-size: var(--type-body); font-weight: 700; color: var(--ink); }
  .cmp-lens { margin: 0 0 var(--space-6); font-size: var(--type-label); color: var(--ink-soft); }
  .cmp-head .action-btn { margin-top: auto; }
  .cmp-row-label {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: var(--space-8);
    margin: var(--space-6) 0 var(--space-neg-2);
    font-size: var(--type-label);
    font-weight: 700;
    color: var(--ink);
  }
  .cmp-row-caption { font-weight: 400; color: var(--ink-soft); }
  .cmp-card { padding: var(--space-12) var(--space-14) var(--space-10); gap: var(--space-6); }
  .cmp-diff { border-color: var(--action); }
  .cmp-same { background: transparent; box-shadow: none; }
  .cmp-same .field-lead { color: var(--ink-soft); }
  .diff-tag {
    align-self: flex-start;
    padding: var(--space-1) var(--space-8);
    border-radius: var(--r-pill);
    background: var(--accent-surface);
    color: var(--accent-ink);
    font-size: var(--type-label);
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  .cmp-more { font-size: var(--type-label); }
  .cmp-more summary { min-height: 44px; cursor: pointer; font-size: var(--type-label); font-weight: 700; color: var(--action); }
  .cmp-more .field-para { margin: var(--space-6) 0 0; }
  .choose-note {
    margin: 0 0 var(--space-12);
    padding: var(--space-8) var(--space-12);
    border-radius: var(--r-input);
    background: var(--suggestion-tint);
    color: var(--suggestion-ink);
    font-size: var(--type-label);
  }

  /* -- Dialogs (accept, choose) ------------------------------------------
     One native <dialog>: modal, focus kept inside, Escape closes it. Drawn
     like the cards: surface, border, card radius, the same shadow. */
  dialog.dlg {
    width: min(36rem, calc(100vw - 32px));
    max-height: calc(100vh - 32px);
    padding: var(--space-22) var(--space-26);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    background: var(--surface);
    color: var(--ink);
    box-shadow: var(--shadow-modal);
    overflow-y: auto;
  }
  dialog.dlg::backdrop { background: var(--backdrop); }
  .dlg h2 { font-size: var(--type-heading); font-weight: 700; letter-spacing: -0.01em; }
  .dlg-sub { margin: var(--space-4) 0 0; font-size: var(--type-body); color: var(--ink-soft); }
  .dlg-quote {
    margin: var(--space-12) 0 0;
    padding: var(--space-8) var(--space-12);
    border-left: 2px solid var(--line);
    background: var(--bg);
    border-radius: 0 var(--r-input) var(--r-input) 0;
    font-size: var(--type-label);
  }
  .dlg label { display: block; margin-top: var(--space-14); font-size: var(--type-label); font-weight: 600; color: var(--ink); }
  .dlg-hint { font-weight: 400; color: var(--ink-soft); }
  .dlg textarea, .dlg input[type="text"] {
    display: block;
    width: 100%;
    margin-top: var(--space-6);
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: var(--r-input);
    padding: var(--space-10) var(--space-12);
    font-size: var(--type-label);
    color: var(--ink);
  }
  .dlg-checks { margin-top: var(--space-16); padding: var(--space-10) var(--space-14); border-radius: var(--r-input); background: var(--suggestion-tint); }
  .dlg-checks h3 { font-size: var(--type-label); font-weight: 700; color: var(--suggestion-ink); }
  .dlg-checks ul { margin: var(--space-6) 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: var(--space-4); font-size: var(--type-body); }
  .dlg-checks .seq { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 700; margin-right: var(--space-6); color: var(--suggestion-ink); }
  .dlg-checks p { margin: var(--space-8) 0 0; font-size: var(--type-label); color: var(--suggestion-ink); }
  .dlg-error { margin: var(--space-12) 0 0; font-size: var(--type-label); font-weight: 700; color: var(--suggestion-ink); }
  .dlg-error:empty { display: none; }
  .dlg-actions { margin-top: var(--space-18); display: flex; justify-content: flex-end; gap: var(--space-8); }
  .dlg-actions .action-btn, .dlg-actions .ghost-btn { padding: var(--space-8) var(--space-18); font-size: var(--type-label); }

  /* Point 1: the footer (plugin version, "Canvas after Dorobantu et al.
     2024") is print-only now — it cost about 100px of always-visible screen
     for a credit line, which mattered most at 390px (SQ-111's "half
     screen"). */
  .print-only { display: none; }
  footer { padding: var(--space-10) var(--space-24) var(--space-16); font-size: var(--type-label); color: var(--ink-soft); }

  .dlg textarea, .dlg input[type="text"], .comment-form textarea, .comment-form input[type="text"] { font-size: var(--type-body); }

  .empty-note { color: var(--ink-soft); font-style: italic; font-size: var(--type-label); }

  /* On a shared screen the field number sits beside, not above, its
     question: preserve room for the complete statement and ownership. */
  @media screen and (min-width: 901px) {
    .poster-cell .field-card { position: relative; }
    .poster-cell .field-eyebrow { position: absolute; top: var(--space-card); right: var(--space-card); }
    .poster-cell .field-question { padding-right: var(--space-36); }
  }

  @media (max-width: 900px) {
    #body-shell { flex-direction: column; }
    #rail {
      flex: 0 0 auto;
      width: 100%;
      border-right: 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      max-height: 120px;
      order: 1;
    }
    #body-shell.poster-active #rail,
    #body-shell.compare-active #rail { display: none; }
    /* Each field remains a whole target; extra fields scroll vertically. */
    .rail-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr)); }
    .rail-card { height: 100%; }
    .rail-question { min-width: 0; overflow-wrap: anywhere; }
    .rail-totalk-badge { flex-shrink: 0; }
    .cmp-grid { grid-template-columns: repeat(var(--k, 3), minmax(0, 1fr)); }
    .cmp-row-label, .element-nav { flex-wrap: wrap; }
    #stage { padding: var(--space-16); }
    #topbar { padding: var(--space-10) var(--space-14); }
    #poster.active { min-height: 0; }
    .poster-grid { grid-template-columns: 1fr; grid-template-rows: none; }
    .poster-title { font-size: var(--type-title); }
    .field-body-full { padding: var(--space-16) var(--space-18); max-width: none; }
    .comment-form { max-width: none; }
  }

  @media (max-width: 600px) {
    .cmp-grid { grid-template-columns: minmax(0, 1fr); }
    .cmp-head { position: static; }
    /* When comparison columns stack, the framing name travels with its text. */
    .cmp-context {
      position: static;
      width: auto;
      height: auto;
      margin: 0;
      overflow: visible;
      clip: auto;
      white-space: normal;
      font-size: var(--type-label);
      font-weight: 700;
    }
  }

  @media print {
    #notice, #topbar, #rail, .action-btn, .comment-form, .stmt-actions,
    .element-nav, .field-foot, .skip-link, .poster-orientation {
      display: none !important;
    }
    .print-only { display: block !important; }
    html, body, #app, #body-shell, #stage {
      height: auto !important;
      overflow: visible !important;
      display: block !important;
    }
    .view { display: block !important; }
    .field-card, .agenda-item-open { cursor: default; box-shadow: none; }
    :root {
      color-scheme: light;
      --bg: var(--light-bg); --surface: var(--light-surface); --ink: var(--light-ink); --ink-soft: var(--light-ink-soft);
      --action: var(--light-action); --action-ink: var(--light-action-ink); --icon-grad-start: var(--light-icon-grad-start);
      --border: var(--light-border); --suggestion-ink: var(--light-suggestion-ink);
      --type-label: 12px; --type-body: 14px; --type-heading: 18px; --type-title: 22px;
    }
    body { background: var(--surface); }
    #poster.active { display: block; min-height: 0; }
    #poster .status-label { font-size: 9px; padding: var(--space-1) var(--space-5); margin-bottom: var(--space-2); }
    #poster .num-badge { font-size: 10px; min-width: 20px; height: 20px; }
    #poster .poster-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: none; }
    #poster .field-card { break-inside: avoid; }
    /* The poster must land on one A4 landscape page (about 1030x700 CSS px
       after the page margin), so its type and spacing shrink for paper. */
    #poster { padding: 0; }
    #poster .poster-head { margin-bottom: var(--space-8); }
    #poster .poster-title { font-size: 22px; }
    #poster .poster-eyebrow { font-size: 11px; }
    #poster .poster-grid { gap: var(--space-6) var(--space-10); }
    #poster .poster-row-label { font-size: 10px; margin: var(--space-4) 0 var(--space-neg-1); }
    #poster .field-card { padding: var(--space-10) var(--space-12) var(--space-10); gap: var(--space-4); border-radius: 14px; }
    #poster .field-question { font-size: 13.5px; }
    #poster .field-lead { font-size: 11.5px; line-height: 1.35; }
  }
  @page { size: A4; margin: 2cm; }
  @page poster { size: A4 landscape; margin: 1.2cm; }
  .page-section { break-before: page; margin-bottom: var(--space-page); }
  #poster { page: poster; }
</style>
</head>
<body>
<a href="#stage" class="skip-link">Skip to content</a>
<div id="notice" role="alert" hidden>
  <span class="notice-icon" aria-hidden="true">&#9888;</span>
  <span id="notice-text"></span>
  <button type="button" id="notice-dismiss">Dismiss</button>
</div>
<div id="app">
  <p class="load-message">Loading…</p>
</div>
<dialog id="dlg" class="dlg" aria-labelledby="dlg-title"></dialog>
<script>
(function () {
  'use strict';

  // Daniel's 2026-09-30 direction (SQ-110 comment c_mun9rkzh_c1fd1c, point 1):
  // each of the nine fields is headed by a plain human question; the canvas
  // term goes underneath, small. The wording lives in hooks/lib/agenda.js and
  // arrives with every state, so the tab and the CLI's Markdown export cannot
  // drift apart; an element number outside 1-9 falls back to its own title.
  var HUMAN_QUESTIONS = {};
  var ROW_LABELS = [
    { from: 1, to: 3, label: 'Motivation' },
    { from: 4, to: 6, label: 'Method' },
    { from: 7, to: 9, label: 'Contribution' }
  ];

  // One vocabulary for visible status labels in every reading view.
  var STATUS_WORD = { accepted: 'Decided', stated: 'Said by the authors', tentative: 'Draft', proposed: 'Suggestion' };

  var qs = new URLSearchParams(location.search);
  var fixturePath = qs.get('fixture');
  var fixtureMode = !!fixturePath;

  // The filter narrows entry lists, never counts, statuses or the shared
  // agenda. Its state lives only in the fragment and survives code redemption.
  var UNKNOWN = 'unknown';
  function nameOf(d) { return d.by || UNKNOWN; }
  function readByFilter() {
    return new URLSearchParams(location.hash.slice(1)).get('by');
  }
  var byFilter = readByFilter();
  function writeByFilter() {
    history.replaceState(null, '', location.pathname + location.search
      + (byFilter !== null ? '#by=' + encodeURIComponent(byFilter) : ''));
  }
  function setByFilter(name) {
    byFilter = name;
    writeByFilter();
    render();
    // Replacing the entry lists also replaces the clicked button. Keep
    // keyboard focus on the active filter instead of dropping it to the page.
    var active = app.querySelector('.by-filter button[aria-pressed="true"]');
    if (active) active.focus();
  }
  function passesFilter(d) { return byFilter === null || nameOf(d) === byFilter; }
  function namesIn(decisions) {
    var names = [];
    var unknown = false;
    decisions.forEach(function (d) {
      if (!d.by) unknown = true;
      else if (names.indexOf(d.by) < 0) names.push(d.by);
    });
    return unknown && names.indexOf(UNKNOWN) < 0 ? names.concat([UNKNOWN]) : names;
  }
  function renderEntryBy(d) {
    return '<span class="entry-by">' + (d.by ? 'By ' + esc(d.by) : UNKNOWN) + '</span>';
  }

  // The URL carries a single-use code, not the write token. The view trades
  // the code for the token once and keeps the token in this variable only:
  // never in storage, never back in the URL.
  var token = null;
  var sessionCode = null;
  if (!fixtureMode) {
    var m = /(?:^|[#&])c=([0-9a-f]+)/.exec(location.hash);
    sessionCode = m ? m[1] : null;
    writeByFilter();
  }
  var LINK_USED = 'This session link was already used. Stop `serve` and start it again.';

  var state = null;
  var activeView = 'poster';
  var app = document.getElementById('app');
  var noticeBox = document.getElementById('notice');
  var noticeText = document.getElementById('notice-text');
  document.getElementById('notice-dismiss').addEventListener('click', function () { noticeBox.hidden = true; });

  function showNotice(msg) {
    noticeText.textContent = msg;
    noticeBox.hidden = false;
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function titleize(slug) {
    return String(slug || '').split(/[-_]+/).filter(Boolean).map(function (w) {
      return w.charAt(0).toUpperCase() + w.slice(1);
    }).join(' ');
  }

  // Point 2: frontmatter.title when the researcher gave one, else the
  // project slug titleized as before.
  function paperTitle(s) {
    var t = s.frontmatter && s.frontmatter.title;
    if (t && String(t).trim()) return String(t).trim();
    return titleize(s.project || (s.frontmatter && s.frontmatter.project) || '') || 'Untitled project';
  }

  // Point 3: "the citekey in the source list" becomes "Gerlach & Cenfetelli
  // 2020" — a citekey of the `author-author-year` or `author-etal-year`
  // shape a researcher's own bibliography tool would produce. A citekey
  // outside that shape (no trailing 4-digit year) is shown as written,
  // because guessing at an unfamiliar convention is worse than the raw key.
  function formatCitekey(key) {
    var parts = String(key).split('-').filter(Boolean);
    var year = parts[parts.length - 1];
    if (!/^\d{4}$/.test(year)) return key;
    var authors = parts.slice(0, -1);
    if (!authors.length) return key;
    var names = authors[authors.length - 1] === 'etal'
      ? titleize(authors[0]) + ' et al.'
      : authors.map(titleize).join(' & ');
    return names + ' ' + year;
  }

  // Extracts the page reference from a statement's `src:` tag so the view
  // never shows the raw tag text (point 4: "no src: text"). Falls back to
  // the whole tag value when no "p. …" portion is present, and handles the
  // `unverified` tag from the sparse fixture. `full` is what the source-key
  // list shows: "Gerlach & Cenfetelli 2020, p. 1706", not the citekey.
  function pageRef(statement) {
    var tag = (statement.tags || [])[0];
    if (!tag) return null;
    if (tag === 'unverified') return { label: 'unverified', full: 'No source found; unverified.' };
    if (tag.indexOf('src:') === 0) {
      var value = tag.slice(4).trim();
      var split = /^([\w-]+)\s+(p\.\s*\S.*)$/.exec(value);
      if (split) {
        return { label: split[2].trim(), full: formatCitekey(split[1]) + ', ' + split[2].trim() };
      }
      var match = /p\.\s*\S.*$/.exec(value);
      return { label: match ? match[0].trim() : value, full: value };
    }
    return { label: tag, full: tag };
  }

  // A log entry body is the entry's text followed by optional labelled lines
  // that hooks/lib/decisions.js writes as `**By:** …`, `**Why:** …`,
  // `**Explained:** …`, `**Rejected:** …`, `**Open at acceptance:** #a, #b` and
  // `**Supersedes:** #n`. Split those off first, so the main text ends at its
  // own trailing "[marker, src: …]" annotation (the same free-text convention
  // canvas.md uses for statements). That annotation becomes a visible status label and the
  // page reference is kept, quietly, the way a statement's source appears. Text
  // on the lines after a labelled line belongs to that label. The label
  // pattern is the library's (FIELD_RE in hooks/lib/decisions.js), and like the
  // library the page never reads an entry's first line as a label: that line
  // is the researcher's text, whatever it looks like.
  var ENTRY_LABEL = /^\*\*(By|Why|Explained|Rejected|Open at acceptance|Supersedes):\*\* ?(.*)$/;
  function parseFindingBody(raw) {
    var main = [];
    var notes = [];
    String(raw == null ? '' : raw).split('\n').forEach(function (line, i) {
      var label = i ? ENTRY_LABEL.exec(line) : null;
      if (label) notes.push({ label: label[1], text: label[2].trim() });
      else if (notes.length) notes[notes.length - 1].text = (notes[notes.length - 1].text + ' ' + line.trim()).trim();
      else main.push(line);
    });
    var text = main.join('\n').trim();
    var m = /\s*\[([^\]]*)\]\s*$/.exec(text);
    if (!m) return { text: text, pageRef: null, notes: notes };
    var pageMatch = /p\.\s*\S.*$/.exec(m[1]);
    return { text: text.slice(0, m.index).trim(), marker: m[1].split(',')[0].trim(), pageRef: pageMatch ? pageMatch[0].trim() : null, notes: notes };
  }

  // One rendering of a log entry body for every reading view: the main text
  // with its page as a superscript, then each labelled line as a quiet second
  // line ("Why: …") in the muted colour. No raw markers, no asterisks.
  function renderEntryBody(raw) {
    var parsed = parseFindingBody(raw);
    return renderStatus(parsed.marker) + esc(parsed.text)
      + (parsed.pageRef ? ' <sup class="src-ref">' + esc(parsed.pageRef) + '</sup>' : '')
      + parsed.notes.filter(function (n) { return n.label !== 'By'; }).map(function (n) {
        return '<span class="entry-note">' + esc(n.label) + ': '
          + (n.label === 'Open at acceptance' ? seqLinks(n.text) : esc(n.text)) + '</span>';
      }).join('');
  }

  // "#4, #7" as links that open the History entry with that number.
  function seqLinks(text) {
    return esc(text).replace(/#(\d+)/g, function (all, n) {
      return '<button type="button" class="seq-link" data-view-target="log" data-scroll-to="entry-' + n + '">#' + n + '</button>';
    });
  }

  // The open field most others depend on, transitively, per SQ-83's recon:
  // combine open/closed status with the profile's dependency graph and pick
  // the open field with the largest transitive dependent set.
  function computeAccent(elements, graph) {
    if (!graph) return null;
    var reverse = {};
    Object.keys(graph).forEach(function (n) { reverse[n] = reverse[n] || []; });
    Object.keys(graph).forEach(function (n) {
      graph[n].forEach(function (dep) {
        reverse[dep] = reverse[dep] || [];
        reverse[dep].push(Number(n));
      });
    });
    function transitiveDependents(n) {
      var seen = new Set();
      var stack = (reverse[n] || []).slice();
      while (stack.length) {
        var cur = stack.pop();
        if (seen.has(cur)) continue;
        seen.add(cur);
        (reverse[cur] || []).forEach(function (x) { if (!seen.has(x)) stack.push(x); });
      }
      return seen.size;
    }
    var best = null;
    var bestCount = 0;
    elements.forEach(function (e) {
      if (e.status.status === 'accepted') return;
      var c = transitiveDependents(e.number);
      if (c > bestCount) { bestCount = c; best = e.number; }
    });
    return best;
  }

  function findingsFor(decisions, number) {
    return decisions.filter(function (d) {
      if (d.kind !== 'DISCOVERY') return false;
      var found = /^(\d+)/.exec(d.ref || '');
      return found && Number(found[1]) === number;
    });
  }

  // Point 2: the poster card's headline is "the first statement that is not
  // a suggestion" — the paper's own voice, not a Claude paraphrase, even
  // when the very first statement in document order happens to be
  // `[proposed]` (element 1's 1.1 in the exemplar). If a field has nothing
  // but suggestions, the lead falls back to the first statement there is,
  // flagged so the card can still render it as a quiet idea rather than a
  // false headline.
  function leadStatementFor(e) {
    var fallback = null;
    for (var qi = 0; qi < e.questions.length; qi += 1) {
      var q = e.questions[qi];
      for (var si = 0; si < q.statements.length; si += 1) {
        var st = q.statements[si];
        if (!fallback) fallback = { statement: st, question: q };
        if (st.marker !== 'proposed') return { statement: st, question: q };
      }
    }
    return fallback ? { statement: fallback.statement, question: fallback.question } : null;
  }

  // Point 3: a DISCOVERY/History entry's `ref` is "5 Research Setting" (the
  // canvas element number and its category); the reading views show the
  // human question that element answers instead.
  function refToQuestion(ref) {
    var m = /^(\d+)/.exec(ref || '');
    var n = m && Number(m[1]);
    return (n && HUMAN_QUESTIONS[n]) || ref;
  }

  // Every reading view uses the same visible word and ownership treatment.
  // Unknown or unmarked prose carries no inferred author/model attribution.
  function renderStatus(marker) {
    var word = Object.hasOwn(STATUS_WORD, marker) ? STATUS_WORD[marker] : null;
    if (!word) return '';
    var authors = marker === 'accepted' || marker === 'stated';
    return '<span class="status-label status-label-' + (authors ? 'authors' : 'model') + '">'
      + '<span class="status-word">' + esc(word) + '</span>'
      + '<span class="status-owner">' + (authors ? 'Authors' : 'Model proposal') + '</span></span>';
  }

  // `full` adds accept/mark-as-said actions, never changes status visibility.
  function renderStatement(s, opts) {
    var cls = ['stmt'];
    if (s.marker) cls.push('stmt-' + s.marker);
    var inner = renderStatus(s.marker) + esc(s.text);

    var refHtml = '';
    if (opts.footnotes) {
      var ref = pageRef(s);
      if (ref) {
        opts.footnotes.push(ref);
        var idx = opts.footnotes.length;
        refHtml = opts.linked
          ? ' <sup class="src-ref"><a href="#src-' + opts.elementNumber + '-' + idx + '" id="srcref-' + opts.elementNumber + '-' + idx + '">' + esc(ref.label) + '</a></sup>'
          : ' <sup class="src-ref">' + esc(ref.label) + '</sup>';
      }
    }

    var actionsHtml = '';
    if (opts.full && !fixtureMode) {
      var actions = [];
      if (['proposed', 'tentative', 'stated'].indexOf(s.marker) !== -1) {
        actions.push('<button type="button" class="action-btn action-btn-primary" data-action="accept" data-question="' + esc(opts.questionId) + '" data-hash="' + esc(s.hash) + '">Accept&hellip;</button>');
      }
      if (['proposed', 'tentative'].indexOf(s.marker) !== -1) {
        actions.push('<button type="button" class="action-btn action-btn-outline" data-action="stated" data-question="' + esc(opts.questionId) + '" data-hash="' + esc(s.hash) + '">Mark as said</button>');
      }
      if (actions.length) actionsHtml = '<span class="stmt-actions">' + actions.join('') + '</span>';
    }

    return '<span class="' + cls.join(' ') + '">' + inner + '</span>' + refHtml + actionsHtml;
  }

  // The full field view's prose renderer: one paragraph per statement, so a
  // suggestion's quiet idea note (point 5) never glues onto an authors'
  // sentence the way the old single-paragraph-per-question layout did. The
  // question id (1.1 … 9.3) is kept as the paragraph's own `id`, an anchor a
  // reader can still link to, but not as visible text (point 3); an empty
  // question shows itself plus "Not answered yet", never a dashed error
  // look.
  function renderFieldBody(e, opts) {
    var footnotes = opts.linked ? [] : null;
    var paras = e.questions.map(function (q) {
      if (!q.statements.length) {
        return '<p class="field-para field-gap" id="q-' + esc(q.id) + '" data-qid="' + esc(q.id) + '">'
          + '<span class="field-gap-question">' + esc(q.text) + '</span> '
          + '<span class="field-gap-note">Not answered yet.</span></p>';
      }
      return q.statements.map(function (s, i) {
        var body = renderStatement(s, {
          full: opts.linked,
          linked: opts.linked,
          footnotes: footnotes,
          elementNumber: e.number,
          questionId: q.id
        });
        return '<p class="field-para" id="q-' + esc(q.id) + (i ? '-' + i : '') + '" data-qid="' + esc(q.id) + '">' + body + '</p>';
      }).join('');
    }).join('');
    return { html: paras, footnotes: footnotes || [] };
  }

  // Point 1: the field is headed by the plain human question, in large
  // type; the canvas term sits under it, small — kept here because this is
  // the element view, the one place point 3 still allows it.
  function fieldHeader(e, big) {
    return '<' + (big ? 'h1 tabindex="-1"' : 'span') + ' class="field-question' + (big ? ' field-question-lg' : '') + '">'
      + esc(HUMAN_QUESTIONS[e.number] || e.title) + '</' + (big ? 'h1' : 'span') + '>'
      + '<span class="field-eyebrow"><span class="num-badge" aria-hidden="true">' + e.number + '</span>'
      + '<span class="field-term">' + esc(e.title) + '</span></span>';
  }

  // The paper's title is the poster's large heading and appears nowhere else
  // in the chrome; the bar carries only the brand and the three views.
  function renderTopbar(s) {
    return '<header id="topbar">'
      + '<div id="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>'
      + '<span class="brand-text">Research harness <span class="brand-sep">/</span> Canvas</span></div>'
      + '<nav id="view-tabs" aria-label="Views">'
      + tabButton('poster', 'Poster')
      + (variantsOf(s).length ? tabButton('compare', 'Framings') : '')
      + tabButton('agenda', 'To talk about')
      + tabButton('log', 'History')
      + '</nav>'
      + '</header>';
  }

  function tabButton(view, label) {
    return '<a class="segment" href="?view=' + view + '" data-view-target="' + view + '">' + esc(label) + '</a>';
  }

  function renderRail(s) {
    var elements = s.elements;
    var graph = s.graph || null;
    var accent = s.profileError ? null : computeAccent(elements, graph);
    var cards = elements.map(function (e) {
      var totalk = findingsFor(s.decisions, e.number).length;
      var classes = ['rail-card'];
      if (accent === e.number) classes.push('rail-card-accent');
      return '<li><button type="button" class="' + classes.join(' ') + '" data-view-target="element-' + e.number + '">'
        + '<span class="rail-top"><span class="num-badge">' + e.number + '</span>'
        + '<span class="rail-question">' + esc(HUMAN_QUESTIONS[e.number] || e.title) + '</span>'
        + (totalk ? '<span class="rail-totalk-badge"><span aria-hidden="true">' + totalk + '</span><span class="sr-only"> to talk about</span></span>' : '')
        + '</span>'
        + '<span class="rail-term">' + esc(e.title) + '</span>'
        + '</button></li>';
    }).join('');
    return '<nav id="rail" aria-label="Fields overview"><p class="rail-label">Fields</p><ol class="rail-list">' + cards + '</ol></nav>';
  }

  // Point 1/8: one card, one heading, one complete lead sentence in the
  // authors' own voice (point 2), one "More" link — not a button wrapping
  // the whole card. The row label is now its own grid item (see the CSS
  // comment), so it genuinely spans the row instead of only sitting inside
  // the first card.
  function renderPosterCard(e, totalkCount) {
    var question = HUMAN_QUESTIONS[e.number] || e.title;
    var lead = leadStatementFor(e);
    var classes = ['field-card'];
    var leadHtml;
    if (lead) {
      leadHtml = '<p class="field-lead">' + renderStatus(lead.statement.marker) + esc(lead.statement.text) + '</p>';
    } else {
      leadHtml = '<p class="field-lead field-gap-note">Not answered yet.</p>';
    }
    return '<li class="poster-cell">'
      + '<article class="' + classes.join(' ') + '">'
      + '<span class="field-eyebrow" aria-hidden="true"><span class="num-badge">' + e.number + '</span></span>'
      + '<h2 class="field-question">' + esc(question) + '</h2>'
      + leadHtml
      + '<div class="field-foot">'
      + '<button type="button" class="field-more" data-view-target="element-' + e.number + '">More<span class="sr-only"> about ' + esc(question) + '</span></button>'
      + (totalkCount
          ? '<button type="button" class="field-totalk" data-view-target="agenda" data-scroll-to="agenda-field-' + e.number + '">'
            + totalkCount + (totalkCount === 1 ? ' thing' : ' things') + ' to talk about<span class="sr-only">, ' + esc(question) + '</span> <span aria-hidden="true">&rarr;</span></button>'
          : '')
      + '</div>'
      + '</article></li>';
  }

  // The poster: the whole paper on one screen, argument order, print-only
  // footer, no side rail (both hidden by CSS while this view is active).
  function renderPoster(s) {
    var elements = s.elements;
    var outlet = s.frontmatter && s.frontmatter.outlet;

    var cells = [];
    elements.forEach(function (e) {
      var rowLabel = ROW_LABELS.filter(function (r) { return r.from === e.number; })[0];
      if (rowLabel) cells.push('<li class="poster-row-label" aria-hidden="true">' + esc(rowLabel.label) + '</li>');
      cells.push(renderPosterCard(e, (s.agenda.fields.filter(function (f) { return f.number === e.number; })[0] || { findings: [] }).findings.length));
    });

    return '<section id="poster" data-view="poster" class="view page-section" tabindex="-1">'
      + '<div class="poster-head">'
      + (outlet ? '<p class="poster-eyebrow">' + esc(outlet) + '</p>' : '')
      + '<h1 tabindex="-1" class="poster-title">' + esc(paperTitle(s)) + '</h1>'
      + '<p class="view-sub poster-orientation">The paper&rsquo;s argument in nine fields. Open a field to comment, mark a statement as said, or accept it with your own sentence. Agents propose; you decide.</p>'
      + '</div>'
      + '<ol class="poster-grid">' + cells.join('') + '</ol>'
      + '</section>';
  }

  // -- Framings -------------------------------------------------------
  // The project's variants, each a whole canvas state of its own (GET
  // /api/state: `variants: [{name, lens, state}]`). An older payload has none.
  function variantsOf(s) { return (s && s.variants) || []; }

  function variantElement(v, number) {
    return v.state.elements.filter(function (e) { return e.number === number; })[0] || null;
  }

  // What a field says, for comparing: each question's statements, text only,
  // whitespace collapsed. Markers and sources are not compared — a field worded
  // alike does not differ, and one worded differently does, whatever either
  // calls it.
  function fieldSignature(e) {
    if (!e) return '';
    return e.questions.map(function (q) {
      return q.id + ':' + q.statements.map(function (st) { return String(st.text).replace(/\s+/g, ' ').trim(); }).join('|');
    }).join('\n');
  }

  function fieldDiffers(variants, number) {
    var seen = {};
    variants.forEach(function (v) { seen[fieldSignature(variantElement(v, number))] = true; });
    return Object.keys(seen).length > 1;
  }

  // The server's own default for what a choice sets aside: the other
  // framings' names with their lenses (hooks/lib/choose.js), prefilled in the
  // dialog and editable there.
  function defaultRejected(variants, name) {
    return variants.filter(function (v) { return v.name !== name; }).map(function (v) {
      return v.lens ? v.name + ' (lens: ' + v.lens + ')' : v.name;
    }).join('; ');
  }

  // Why choosing is off, in one line, or null. The library refuses while the
  // main canvas holds an [accepted] statement (a framing is chosen before
  // anything is accepted) or a [stated] one (a choice would delete the authors'
  // own words). Saying so here saves the round trip; if the server still
  // refuses, its message is shown as it is.
  function chooseBlock(s) {
    var accepted = [];
    var stated = [];
    s.elements.forEach(function (e) {
      e.questions.forEach(function (q) {
        q.statements.forEach(function (st) {
          if (st.marker === 'accepted' && accepted.indexOf(q.id) === -1) accepted.push(q.id);
          if (st.marker === 'stated' && stated.indexOf(q.id) === -1) stated.push(q.id);
        });
      });
    });
    var parts = [];
    var why = [];
    if (accepted.length) {
      parts.push(accepted.length + ' accepted (' + accepted.join(', ') + ')');
      why.push('A framing is chosen before anything is accepted.');
    }
    if (stated.length) {
      parts.push(stated.length + ' said by the authors (' + stated.join(', ') + ')');
      why.push('A choice would replace what the authors said.');
    }
    if (!parts.length) return null;
    return 'Choosing is off: the main canvas already holds ' + parts.join(' and ') + '. ' + why.join(' ');
  }

  function renderCompareCard(v, e, differs, several) {
    var ve = variantElement(v, e.number);
    var question = HUMAN_QUESTIONS[e.number] || e.title;
    var lead = ve ? leadStatementFor(ve) : null;
    var all = [];
    if (ve) ve.questions.forEach(function (q) { all = all.concat(q.statements); });
    var classes = ['field-card', 'cmp-card'];
    if (differs) classes.push('cmp-diff');
    else if (several) classes.push('cmp-same');
    var leadHtml = lead
      ? '<p class="field-lead">' + renderStatus(lead.statement.marker) + esc(lead.statement.text) + '</p>'
      : '<p class="field-lead field-gap-note">Not answered yet.</p>';
    // The card leads with one sentence, like the poster; a difference can sit
    // in a statement below it, so every statement of the field is one click away.
    var more = all.length > 1
      ? '<details class="cmp-more"><summary>All ' + all.length + ' statements<span class="sr-only"> of ' + esc(v.name) + ' on ' + esc(question) + '</span></summary>'
        + all.map(function (st) {
          return '<p class="field-para">' + renderStatus(st.marker) + esc(st.text) + '</p>';
        }).join('') + '</details>'
      : '';
    return '<article class="' + classes.join(' ') + '">'
      + '<span class="cmp-context sr-only">' + esc(v.name) + ', ' + esc(question) + (differs ? ', differs from the other framings' : '') + '. </span>'
      + (differs ? '<span class="diff-tag" aria-hidden="true">Differs</span>' : '')
      + leadHtml + more
      + '</article>';
  }

  // The poster's cards, one column per framing and one row per field, each
  // column headed by the framing's name and lens, with the action that chooses
  // it. Nothing here edits a statement: the view only reads them.
  function renderCompare(s) {
    var variants = variantsOf(s);
    if (!variants.length) return '';
    var several = variants.length > 1;
    var blocked = chooseBlock(s);
    var heads = variants.map(function (v) {
      return '<div class="cmp-head"><div class="cmp-head-box">'
        + '<h2 class="cmp-name">' + esc(v.name) + '</h2>'
        + '<p class="cmp-lens">' + (v.lens ? 'Lens: ' + esc(v.lens) : 'No lens recorded') + '</p>'
        + '<button type="button" class="action-btn action-btn-primary" data-action="choose" data-variant="' + esc(v.name) + '"'
        + (blocked ? ' disabled aria-describedby="choose-note"' : '') + '>Choose this framing<span class="sr-only">: ' + esc(v.name) + '</span></button>'
        + '</div></div>';
    }).join('');
    var rows = s.elements.map(function (e) {
      var differs = several && fieldDiffers(variants, e.number);
      return '<h2 class="cmp-row-label"><span class="num-badge" aria-hidden="true">' + e.number + '</span>' + esc(HUMAN_QUESTIONS[e.number] || e.title)
        + (several ? '<span class="cmp-row-caption">&middot; ' + (differs ? 'differs between framings' : 'the same in every framing') + '</span>' : '') + '</h2>'
        + variants.map(function (v) { return renderCompareCard(v, e, differs, several); }).join('');
    }).join('');
    return '<section id="compare" data-view="compare" class="view page-section">'
      + '<div class="view-head"><h1 tabindex="-1">Framings</h1><p class="view-sub">The same paper read through each lens. Fields that differ are marked; the rest are faded. Choosing one makes it the main canvas and keeps the others as the record.</p></div>'
      + (blocked ? '<p class="choose-note" id="choose-note">' + esc(blocked) + '</p>' : '')
      + '<div class="cmp-grid" style="--k:' + variants.length + '">' + heads + rows + '</div>'
      + '</section>';
  }

  function renderField(e, total) {
    // Sources and visible status words read the same way in fixture mode;
    // only the write actions (accept/mark-as-said) depend on `fixtureMode`,
    // gated separately inside renderStatement.
    var body = renderFieldBody(e, { linked: true });
    var sourceKey = body.footnotes.length
      ? '<div class="source-key-wrap"><ol class="source-key">' + body.footnotes.map(function (ref, i) {
          return '<li id="src-' + e.number + '-' + (i + 1) + '">' + (ref.full ? esc(ref.full) : '—') + ' <a href="#srcref-' + e.number + '-' + (i + 1) + '">&#8617;</a></li>';
        }).join('') + '</ol></div>'
      : '';

    var totalkRaw = findingsFor(state.decisions, e.number).filter(passesFilter);
    var totalkFull = totalkRaw.length
      ? '<div class="field-totalk-full"><h2 class="view-sub field-discussion-title">To talk about</h2>'
        + '<ul class="totalk-list">' + totalkRaw.map(function (d) {
          return '<li class="totalk-item">' + renderEntryBody(d.body) + renderEntryBy(d) + '</li>';
        }).join('') + '</ul></div>'
      : '';

    var commentForm = fixtureMode
      ? '<p class="empty-note">Read-only example. Explore the fields; notes and decisions cannot be saved here.</p>'
      : '<div class="comment-form">'
        + '<label>Something to talk about? Add a note for the meeting.<textarea aria-required="true" aria-describedby="comment-error-' + e.number + '" data-comment-body-for="' + e.number + '"></textarea></label>'
        + '<label>Why (optional) <input type="text" data-comment-why-for="' + e.number + '"></label>'
        + '<p id="comment-error-' + e.number + '" class="comment-error" role="alert"></p>'
        + '<button type="button" class="action-btn action-btn-primary" data-action="comment" data-element="' + e.number + '" data-element-title="' + esc(e.title) + '">Add a note</button>'
        + '</div>';

    var nav = '<div class="element-nav">'
      + (e.number > 1 ? '<button type="button" class="ghost-btn" data-view-target="element-' + (e.number - 1) + '">&larr; Previous field</button>' : '<span></span>')
      + (e.number < total ? '<button type="button" class="ghost-btn" data-view-target="element-' + (e.number + 1) + '">Next field &rarr;</button>' : '<span></span>')
      + '</div>';

    return '<section id="element-' + e.number + '" data-view="element-' + e.number + '" class="view page-section field-view">'
      + nav
      + '<div class="view-head field-head">' + fieldHeader(e, true) + '</div>'
      + '<div class="field-body-full">' + body.html + '</div>'
      + sourceKey
      + totalkFull
      + commentForm
      + '</section>';
  }

  // Point 6: "To talk about" is a meeting starter, not a nine-row form — it
  // lists only fields that actually have a finding, plus the questions
  // nobody has answered yet, named by the field's human question. Both lists
  // are computed by hooks/lib/agenda.js and arrive with the state: the tab and
  // the Markdown the agenda command prints are the same agenda (spec §6).
  function renderAgenda(s) {
    var items = s.agenda.fields.map(function (f) {
      return '<li id="agenda-field-' + f.number + '" tabindex="-1"><button type="button" class="agenda-item-open" data-view-target="element-' + f.number + '">'
        + '<span class="agenda-item-head"><span class="num-badge">' + f.number + '</span>'
        + '<span class="agenda-item-title">' + esc(f.question) + '</span></span>'
        + '<ul class="agenda-findings">' + f.findings.map(function (d) {
            return '<li>' + renderEntryBody(d.body) + renderEntryBy(d) + '</li>';
          }).join('') + '</ul>'
        + '</button></li>';
    }).join('');

    var sections = items ? '<ul class="agenda-list">' + items + '</ul>' : '';
    sections += renderAgendaGaps(s.agenda.gaps);
    if (!sections) sections = '<p class="empty-note">Nothing to talk about right now.</p>';

    return '<section id="agenda" data-view="agenda" class="view page-section">'
      + '<div class="view-head"><h1 tabindex="-1">To talk about</h1><p class="view-sub">Open questions and notes for the meeting. Open a field to add a comment.</p></div>'
      + sections
      + '</section>';
  }

  function renderGapField(group) {
    return '<li><details class="agenda-gap-field"><summary><span class="num-badge">' + group.number + '</span>'
      + '<strong>' + esc(group.question) + '</strong> <span class="agenda-gap-count">'
      + group.gaps.length + (group.gaps.length === 1 ? ' question' : ' questions') + '</span></summary>'
      + '<ul class="agenda-gap-list">' + group.gaps.map(function (g) {
        return '<li><button type="button" class="agenda-gap-item" data-view-target="element-' + g.number + '">'
          + esc(g.text) + '</button></li>';
      }).join('') + '</ul></details></li>';
  }

  // Keep every unanswered prompt reachable, but let the discussion lead.
  function renderAgendaGaps(gaps) {
    if (!gaps.length) return '';
    var groups = new Map();
    gaps.forEach(function (g) {
      if (!groups.has(g.number)) groups.set(g.number, { number: g.number, question: g.question, gaps: [] });
      groups.get(g.number).gaps.push(g);
    });
    return '<details class="agenda-gaps"><summary>Not answered yet <span class="agenda-gap-count">'
      + gaps.length + (gaps.length === 1 ? ' question in ' : ' questions in ')
      + groups.size + (groups.size === 1 ? ' field' : ' fields') + '</span></summary>'
      + '<ul class="agenda-gap-fields">' + Array.from(groups.values()).map(renderGapField).join('') + '</ul></details>';
  }

  function historyLabel(kind) {
    if (kind === 'DISCOVERY') return 'To talk about';
    if (kind === 'CONSTRAINT') return 'Constraint';
    if (kind === 'DECISION') return 'Decision';
    return kind ? (kind.charAt(0) + kind.slice(1).toLowerCase()) : 'Entry';
  }

  // The entry hooks/lib/choose.js writes when the researcher picks a framing:
  // a DECISION whose ref is `framing chosen: <variant name>`.
  var FRAMING_REF = /^framing chosen: (.+)$/;

  // Each entry carries its `#seq`: "Open at acceptance" names entries by it,
  // and its links land on the card with that id.
  // What the server's seal check says about one entry (sealStatus, the verdicts
  // of hooks/lib/review.js). Intact entries need no integrity label.
  var SEAL_STATE = { broken: 'Record changed', legacy: 'Older record; cannot check for changes', unverifiable: 'Cannot check for changes on this device' };
  var BREAK_WHY = {
    unsealed: 'an entry without a change record was added',
    anchor: 'this entry or earlier unchecked entries changed',
    chain: 'earlier entries are missing or were removed',
    content: 'this entry\'s heading or text changed'
  };

  function brokenAt(s) {
    var ledger = s.review && s.review.ledger;
    return ledger && ledger.status === 'broken' && ledger.broken ? ledger.broken : null;
  }

  // A DECISION that does not verify is marked in words, not only in colour: a
  // forged `framing chosen` or accept must not read like the researcher's own.
  function sealFlag(d, s) {
    if (d.kind !== 'DECISION' || !d.sealStatus || d.sealStatus === 'verified') return '';
    var at = brokenAt(s);
    var why = d.sealStatus === 'legacy' ? 'it predates checks for changes'
      : d.sealStatus === 'broken' ? (at && at.seq === d.seq ? 'the saved history changed here: ' + (BREAK_WHY[at.why] || 'the saved record no longer matches') : 'it follows a changed entry' + (at ? ' at #' + at.seq : ''))
      : 'changes cannot be checked on this device';
    return '<p class="seal-flag" role="note"><span aria-hidden="true">&#9888;</span> Decision record cannot be confirmed: ' + esc(why) + '.</p>';
  }

  function renderHistory(s) {
    var buttons = [null].concat(namesIn(s.decisions)).map(function (name) {
      return '<button type="button" class="ghost-btn" data-by="' + esc(name === null ? '' : name)
        + '" aria-pressed="' + (name === byFilter ? 'true' : 'false') + '">' + esc(name === null ? 'All' : name) + '</button>';
    }).join('');
    var rows = s.decisions.map(function (d) {
      if (d.kind === 'SESSION') {
        return '<li id="entry-' + esc(d.seq) + '" tabindex="-1"><div role="separator" class="session-divider">Session: '
          + esc(d.ref) + ' &middot; ' + esc(d.date) + renderEntryBy(d) + '</div></li>';
      }
      if (!passesFilter(d)) return '';
      if (d.kind === 'MERGE') {
        return '<li id="entry-' + esc(d.seq) + '" tabindex="-1"><p class="merge-line">Merged from '
          + esc((d.ref || '').replace(/^from /, '')) + ' &mdash; ' + esc((d.body || '').split('\n')[0])
          + renderEntryBy(d) + '</p></li>';
      }
      var framing = d.kind === 'DECISION' ? FRAMING_REF.exec(d.ref || '') : null;
      return '<li class="history-card" id="entry-' + esc(d.seq) + '" tabindex="-1"><p class="history-meta">#' + esc(d.seq) + ' &middot; '
        + esc(framing ? 'Framing chosen' : historyLabel(d.kind)) + ' &middot; ' + esc(d.date) + ' &middot; ' + esc(framing ? framing[1] : refToQuestion(d.ref))
        + (SEAL_STATE[d.sealStatus] ? ' &middot; ' + esc(SEAL_STATE[d.sealStatus]) : '') + '</p>'
        + sealFlag(d, s)
        + '<p class="history-body">' + renderEntryBody(d.body) + renderEntryBy(d) + '</p>'
        + '</li>';
    }).join('');
    return '<section id="log" data-view="log" class="view page-section">'
      + '<div class="view-head"><h1 tabindex="-1">History</h1><p class="view-sub">What has been said and decided, in order.</p></div>'
      + '<div class="by-filter" role="group" aria-label="Show entries by">' + buttons + '</div>'
      + (rows ? '<ol class="history-list">' + rows + '</ol>' : '<p class="empty-note">Nothing yet.</p>')
      + '</section>';
  }

  function renderFooter(s) {
    return '<footer class="page-section print-only"><p>research-harness ' + esc(s.version || 'unknown') + ' &middot; Canvas after Dorobantu et al. 2024</p></footer>';
  }

  function renderStagePanels(s) {
    return renderPoster(s) + renderCompare(s) + renderAgenda(s) + s.elements.map(function (e) { return renderField(e, s.elements.length); }).join('') + renderHistory(s);
  }

  function render() {
    // A stale fragment must not leave the filter bar with no active button.
    if (byFilter !== null && namesIn(state.decisions).indexOf(byFilter) < 0) {
      byFilter = null;
      writeByFilter();
    }
    // The Framings tab exists while the project holds variants; once the last
    // one is gone a reload must not leave the reader on a view with no tab.
    if (activeView === 'compare' && !variantsOf(state).length) activeView = 'poster';
    app.innerHTML = renderTopbar(state)
      + renderNotices(state)
      + '<div id="body-shell">' + renderRail(state) + '<main id="stage" tabindex="-1">' + renderStagePanels(state) + '</main></div>'
      + renderFooter(state);
    applyActiveView();
  }

  function renderNotices(s) {
    var notices = [];
    if (s.profileError) notices.push('<p>Profile: ' + esc(s.profileError) + '</p>');
    if (s.keyError) notices.push('<p>Decision history check: ' + esc(s.keyError) + '</p>');
    var broken = brokenAt(s);
    if (broken) {
      notices.push('<p>Decision history has changed. The first affected entry is <button type="button" class="seq-link" data-view-target="log" data-scroll-to="entry-' + esc(broken.seq) + '">#' + esc(broken.seq) + '</button> ('
        + esc(BREAK_WHY[broken.why] || 'the saved record no longer matches') + '). Every entry from there on is marked in History. The original record is not restored automatically.</p>');
    }
    if (!notices.length) return '';
    return '<div class="notices-banner" role="alert">' + notices.join('') + '</div>';
  }

  function applyActiveView() {
    var views = app.querySelectorAll('.view');
    for (var i = 0; i < views.length; i++) {
      views[i].classList.toggle('active', views[i].getAttribute('data-view') === activeView);
    }
    // Point 1: the side rail is poster-only hidden; every other view keeps
    // it as the way to get from one field to another.
    var shell = document.getElementById('body-shell');
    if (shell) {
      shell.classList.toggle('poster-active', activeView === 'poster');
      shell.classList.toggle('compare-active', activeView === 'compare');
    }
    var tabs = app.querySelectorAll('.segment');
    for (i = 0; i < tabs.length; i++) {
      var tabMatch = tabs[i].getAttribute('data-view-target') === activeView;
      tabs[i].classList.toggle('active', tabMatch);
      if (tabMatch) tabs[i].setAttribute('aria-current', 'page');
      else tabs[i].removeAttribute('aria-current');
    }
    var railCards = app.querySelectorAll('.rail-card');
    for (i = 0; i < railCards.length; i++) {
      var railMatch = railCards[i].getAttribute('data-view-target') === activeView;
      railCards[i].classList.toggle('active', railMatch);
      if (railMatch) railCards[i].setAttribute('aria-current', 'true');
      else railCards[i].removeAttribute('aria-current');
    }
  }

  function focusActiveHeading() {
    var heading = app.querySelector('.view.active h1');
    if (heading) heading.focus();
  }

  function fetchState() {
    var url = fixtureMode ? fixturePath : '/api/state';
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error('failed to load state (' + r.status + ')');
      return r.json();
    });
  }

  function refreshState() {
    return fetchState().then(function (s) {
      state = s;
      HUMAN_QUESTIONS = s.humanQuestions || {};
      render();
    });
  }

  function post(path, payload) {
    return fetch(path, {
      method: 'POST',
      headers: { 'X-Harness-Token': token || '', 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (json) { return { status: r.status, json: json }; });
    });
  }

  // Trades the code from the URL for the write token. A refusal means someone
  // else redeemed the code first (or it expired, or this is a reload): the
  // human has to see that, not a view that silently cannot write.
  function openSession() {
    if (!sessionCode) { showNotice(LINK_USED); return; }
    post('/api/session', { code: sessionCode }).then(function (res) {
      if (res.status === 200 && res.json && res.json.ok && res.json.token) token = res.json.token;
      else showNotice(LINK_USED);
    }).catch(function (err) {
      showNotice('Could not open the session: ' + err.message);
    });
    sessionCode = null;
  }

  function fieldError(field, message) {
    if (!field) return;
    field.setAttribute('aria-invalid', 'true');
    var box = document.getElementById(field.getAttribute('aria-describedby'));
    if (box) box.textContent = message;
    field.focus();
  }

  function doPost(path, payload, field) {
    if (!token) { showNotice(LINK_USED); return; }
    post(path, payload).then(function (res) {
      if (res.status === 200 && res.json && res.json.ok) {
        return refreshState().then(focusActiveHeading);
      }
      if (res.status === 409) {
        showNotice('The canvas changed since this view loaded; reloading.');
        return refreshState().then(focusActiveHeading);
      }
      var message = (res.json && res.json.error) || ('Request failed (' + res.status + ').');
      if (field) fieldError(field, message);
      else showNotice(message);
    }).catch(function (err) {
      if (field) fieldError(field, 'Request failed: ' + err.message);
      else showNotice('Request failed: ' + err.message);
    });
  }

  // -- Dialogs ----------------------------------------------------------
  // Accept and choose each ask for a sentence of the researcher's own, so both
  // go through the one <dialog>. The dialog shows what the server answered
  // when it refuses (a label line in the text, a [stated] statement in the
  // way) inside itself: the notice bar sits under a modal dialog.
  var dlg = document.getElementById('dlg');
  var dialogState = null;
  var dialogBusy = false;

  function findStatement(s, questionId, hash) {
    for (var i = 0; i < s.elements.length; i++) {
      var qs2 = s.elements[i].questions;
      for (var j = 0; j < qs2.length; j++) {
        if (qs2[j].id !== questionId) continue;
        for (var k = 0; k < qs2[j].statements.length; k++) {
          if (qs2[j].statements[k].hash === hash) return { question: qs2[j], statement: qs2[j].statements[k] };
        }
      }
    }
    return null;
  }

  function showDialog(markup, what) {
    dialogState = what;
    dialogBusy = false;
    dlg.innerHTML = markup;
    if (!dlg.open) dlg.showModal();
  }

  function closeDialog() {
    if (dlg.open) dlg.close();
    dialogState = null;
  }

  function dialogError(message, field) {
    // A failure can arrive after the dialog closed: the write is in, the reload
    // of the state is not. Inside a closed dialog nothing is visible, so such a
    // message goes to the notice bar, which outlives the dialog.
    if (!dlg.open) { showNotice(message); return; }
    var box = dlg.querySelector('.dlg-error');
    if (box) box.textContent = message;
    if (field) fieldError(field, message);
  }

  function dialogButtons(confirmLabel) {
    return '<p id="dlg-error" class="dlg-error" role="alert"></p>'
      + '<div class="dlg-actions"><button type="button" class="ghost-btn" data-dlg="cancel">Cancel</button>'
      + '<button type="submit" class="action-btn action-btn-primary">' + esc(confirmLabel) + '</button></div>';
  }

  // The accept dialog: the statement as it stands (never editable here), the
  // one required sentence, and the check questions still open on its question,
  // each with the `#seq` of the log entry that asked it. Accepting with some
