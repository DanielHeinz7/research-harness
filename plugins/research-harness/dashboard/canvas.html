<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research harness — canvas</title>
<style>
  /* Tokens taken from the DSI-WI4 SuperApp (read-only reference, nothing there
     was changed):
     - app/globals.css :root            -> background/surface/text/action/line/border hex values
     - docs/ui-design-direction.md
       "Color roles"                    -> status hex values (#246044/#75500F/#4D655A), the
                                            gradient, focus ring (3px/4px offset), shadow recipes
       "Typography"                     -> local font stack, tabular numerals for ids/counts
       "Density and spacing"            -> the 8/16/24/32/40 scale
       "Shape language"                 -> 22px card radius, 999px pill radius, 12px input radius
     - components/status-badge.tsx      -> never colour alone (reused here for the soft status cues)
     - components/apps/apps-hub.tsx,
       components/apps/app-tile.tsx     -> hub card grid, now the poster grid
       components/site-header.tsx       -> segmented top navigation, brand mark
       components/apps/app-detail.tsx   -> "element in focus" header/body layout, now the field view

     The session view (story-first presentation, decided 2026-09-30): a Poster that
     shows the whole paper on one screen, "To talk about", "History", and a field
     view per element. Read like the paper's argument, not a form: statements as
     prose, status as a soft cue, no counters, no seal status, no "DISCOVERY", no
     visible `src:` text; gaps invite rather than accuse. The write paths
     (accept/stated/comment, expectedHash, the single-use code exchange) are the
     data model's and unchanged. The poster fits 1440x900 without scrolling; the
     side rail is hidden there; the footer is print-only. */
  :root {
    color-scheme: light;
    --bg: #ebf2eb;
    --surface: #ffffff;
    --ink: #193c31;
    --ink-soft: #4d655a;
    --action: #154b38;
    --action-ink: #ffffff;
    --action-hover: #0f3a2b;
    --secondary: #dfeadd;
    --accent-surface: #dbedb0;
    --accent-ink: #193c31;
    --line: #7d9688;
    --border: #cdddca;
    --icon-grad-start: #2b7254;
    --suggestion-tint: rgba(117, 80, 15, 0.1);
    --suggestion-ink: #6b4c11;
    --shadow-card: 0 8px 24px rgba(25, 60, 49, 0.08);
    --shadow-raised: 0 2px 6px rgba(25, 60, 49, 0.1), inset 0 0 0 1px rgba(25, 60, 49, 0.05);
    --r-card: 22px;
    --r-pill: 999px;
    --r-input: 12px;
    --r-icon: 12px;
    --font-ui: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
    --font-num: Arial, Helvetica, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font-family: var(--font-ui);
    color: var(--ink);
    background: var(--bg);
    line-height: 1.55;
  }
  h1, h2, h3, h4 { line-height: 1.25; margin: 0; font-family: var(--font-ui); }
  button, input, textarea { font-family: inherit; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible,
  [tabindex]:focus-visible {
    outline: 3px solid var(--action);
    outline-offset: 4px;
  }

  #notice {
    flex: 0 0 auto;
    z-index: 30;
    background: var(--ink);
    color: #fff;
    padding: 10px 16px;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }
  #notice[hidden] { display: none; }
  #notice:not([hidden]) { display: flex; }
  .notice-icon { font-size: 1rem; }
  #notice button {
    background: transparent;
    color: #fff;
    border: 1px solid #fff;
    border-radius: var(--r-pill);
    padding: 4px 12px;
    cursor: pointer;
    font-weight: 700;
    font-size: 13px;
  }

  #app { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .notices-banner {
    flex: 0 0 auto;
    margin: 12px 24px 0;
    padding: 14px 16px;
    border: 1px solid rgba(117, 80, 15, 0.35);
    background: rgba(117, 80, 15, 0.08);
    border-radius: var(--r-input);
    color: #75500f;
  }
  .notices-banner p { margin: 2px 0; font-size: 14px; }

  #topbar {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 16px;
    padding: 12px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  #brand { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--ink); }
  .brand-mark {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 3px;
    width: 26px;
    height: 26px;
  }
  .brand-mark i {
    display: block;
    border-radius: 4px;
    background: linear-gradient(145deg, var(--icon-grad-start), var(--action));
    font-style: normal;
  }
  .brand-text { font-size: 15px; }
  .brand-sep { color: var(--ink-soft); font-weight: 400; }

  #view-tabs {
    display: flex;
    gap: 4px;
    padding: 4px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 15px;
    box-shadow: inset 0 1px 2px rgba(25, 60, 49, 0.06);
    overflow-x: auto;
  }
  .segment {
    border: 0;
    background: transparent;
    color: var(--ink-soft);
    font-size: 14px;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: 11px;
    cursor: pointer;
    white-space: nowrap;
  }
  .segment.active {
    background: var(--surface);
    color: var(--action);
    font-weight: 700;
    box-shadow: var(--shadow-raised);
  }

  #body-shell { flex: 1 1 auto; min-height: 0; display: flex; }
  /* Point 1: the side rail repeats the poster's own nine cards, so it is
     wasted width there; #stage naturally reflows to the freed space. Other
     views (element, agenda, history) keep it — it is how a reader gets from
     one field to another once they are past the overview. */
  #body-shell.poster-active #rail,
  #body-shell.compare-active #rail { display: none; }

  .skip-link {
    position: absolute;
    left: 12px;
    top: -60px;
    z-index: 50;
    background: var(--action);
    color: var(--action-ink);
    padding: 10px 16px;
    border-radius: var(--r-input);
    font-weight: 700;
    font-size: 13px;
    text-decoration: none;
    transition: top 0.12s ease;
  }
  .skip-link:focus { top: 12px; }

  #rail {
    flex: 0 0 280px;
    overflow-y: auto;
    padding: 16px;
    background: var(--bg);
    border-right: 1px solid var(--border);
  }
  .rail-label {
    margin: 0 4px 10px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
  }
  .rail-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .rail-card {
    width: 100%;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 3px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-input);
    padding: 10px 12px;
    cursor: pointer;
  }
  .rail-card.active { border-color: var(--action); box-shadow: 0 0 0 1px var(--action); }
  .rail-card-accent { box-shadow: inset 2px 0 0 var(--action); }
  .rail-top { display: flex; align-items: center; gap: 8px; }
  .rail-question { font-size: 13px; font-weight: 600; color: var(--ink); }
  .rail-term { font-size: 11px; color: var(--ink-soft); padding-left: 30px; }
  /* Point 8: a colour-only dot fails "not by colour alone"; the badge carries
     its own count as text, so it reads without hover or focus. */
  .rail-totalk-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    border-radius: var(--r-pill);
    background: var(--suggestion-tint);
    color: var(--suggestion-ink);
    font-size: 11px;
    font-weight: 700;
    margin-left: auto;
  }

  .num-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 24px;
    height: 24px;
    padding: 0 5px;
    border-radius: var(--r-icon);
    background: linear-gradient(145deg, var(--icon-grad-start), var(--action));
    color: #fff;
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: 12px;
    flex: 0 0 auto;
  }

  #stage { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 24px; }
  /* Keep the poster's own bottom padding small so the whole paper sits on one
     1440x900 screen without a scroll bar. */
  #body-shell.poster-active #stage { padding-bottom: 8px; }

  .view { display: none; }
  .view.active { display: block; }
  .view-head { margin-bottom: 20px; }
  .view-head h2 { font-size: 22px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; }
  .view-sub { margin: 4px 0 0; font-size: 14px; color: var(--ink-soft); }

  /* -- Poster ------------------------------------------------------ */
  .poster-head { margin-bottom: 12px; max-width: 80rem; }
  .poster-eyebrow { margin: 0; font-size: 12px; color: var(--ink-soft); }
  .poster-title { margin: 1px 0 0; font-size: 26px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; }

  /* Point 1: every card is short enough (one heading, one lead sentence, one
     link) that all nine fit above the fold at 1440x900. The row label is its
     own grid item now — spanning the full row for real, not nested inside
     the first card's box, which used to push that card's content 14px below
     its row-mates (SQ-111's "visual quality" note). */
  .poster-grid {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px 12px;
    align-items: stretch;
  }
  .poster-row-label {
    grid-column: 1 / -1;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    margin: 6px 0 -2px;
  }
  .poster-row-label:first-child { margin-top: 0; }

  .field-card {
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    box-shadow: var(--shadow-card);
    padding: 14px 16px 12px;
  }
  .field-card-accent { box-shadow: var(--shadow-card), inset 3px 0 0 var(--action); }

  .field-eyebrow { display: flex; align-items: center; gap: 8px; }
  .field-term { font-size: 11px; color: var(--ink-soft); }

  .field-question {
    margin: 0;
    font-size: 15.5px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.005em;
    line-height: 1.3;
  }
  .field-question-lg { font-size: 28px; }

  .field-body { font-size: 13.5px; color: var(--ink); }
  .field-body p, .field-para { margin: 0 0 10px; }
  .field-body p:last-child, .field-para:last-child { margin-bottom: 0; }

  /* Point 1: the poster card's one complete sentence — never clamped, never
     faded mid-thought. */
  .field-lead { margin: 0; font-size: 13.5px; line-height: 1.45; color: var(--ink); }

  /* Point 8: a heading plus a link, not one giant button around the card. */
  .field-foot {
    margin-top: auto;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 2px 12px;
  }
  .field-more {
    padding: 0;
    background: none;
    border: 0;
    font-size: 12px;
    font-weight: 700;
    color: var(--action);
    cursor: pointer;
  }
  .field-more:hover, .field-more:focus-visible { text-decoration: underline; }

  /* A quiet line at the card's foot, not a badge: plain words, the arrow is
     decoration. It states a count in text, so it never relies on colour. */
  .field-totalk {
    padding: 0;
    background: none;
    border: 0;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-soft);
    cursor: pointer;
    text-align: right;
  }
  .field-totalk:hover, .field-totalk:focus-visible { color: var(--action); text-decoration: underline; }
  .agenda-list > li:focus { outline: none; }
  .agenda-list > li { scroll-margin-top: 16px; }

  .field-gap { color: var(--ink-soft); }
  .field-gap-question { font-style: normal; }
  .field-gap-note { font-style: italic; }
  .field-para.field-gap {
    border-left: 2px dashed var(--line);
    padding-left: 10px;
  }

  .stmt-tentative { color: var(--ink-soft); }
  /* Point 5: a quiet idea note — a label plus a soft left border — instead of
     a highlighter band across the line. Each statement is its own paragraph
     (below), so a suggestion never glues onto an authors' sentence. */
  .stmt-proposed { font-style: normal; }
  .field-para-idea {
    border-left: 2px solid var(--suggestion-ink);
    padding-left: 10px;
  }
  .idea-tag {
    display: inline-block;
    font-weight: 700;
    font-size: 0.72em;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--suggestion-ink);
    margin-right: 6px;
  }

  .status-cue {
    position: relative;
    display: inline-flex;
    align-items: center;
    margin-left: 3px;
    font-size: 11px;
    color: var(--ink-soft);
    border-radius: 4px;
    cursor: default;
  }
  .status-cue-accepted { color: #246044; }
  .status-glyph { font-size: 12px; }
  .status-tip {
    position: absolute;
    left: 50%;
    bottom: 100%;
    transform: translate(-50%, -4px);
    background: var(--ink);
    color: #fff;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 11px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.12s ease;
  }
  .status-cue:hover .status-tip, .status-cue:focus-visible .status-tip { opacity: 1; }

  .src-ref { font-size: 0.72em; color: var(--ink-soft); }
  .src-ref a { color: var(--ink-soft); text-decoration: underline; text-underline-offset: 2px; }
  .entry-note { display: block; margin-top: 3px; font-size: 0.9em; color: var(--ink-soft); }

  .field-totalk-full { margin-top: 20px; }
  .totalk-list { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .totalk-item {
    background: var(--bg);
    border-radius: var(--r-input);
    padding: 10px 14px;
    font-size: 14px;
    color: var(--ink);
  }

  .source-key-wrap { margin-top: 18px; }
  .source-key { font-size: 12.5px; color: var(--ink-soft); border-top: 1px solid var(--border); padding-top: 10px; margin: 0; }
  .source-key li { margin-bottom: 3px; }
  .source-key a { color: var(--ink-soft); }

  /* -- To talk about (was: Agenda) ------------------------------------ */
  .agenda-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .agenda-item-open {
    width: 100%;
    text-align: left;
    cursor: pointer;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    box-shadow: var(--shadow-card);
    padding: 16px 18px;
  }
  .agenda-item-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .agenda-item-title { font-size: 15px; font-weight: 700; color: var(--ink); }
  .agenda-findings { margin: 0; padding-left: 18px; color: var(--ink-soft); font-size: 13.5px; }
  .agenda-findings li { margin-bottom: 4px; }

  .agenda-gap-list { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .agenda-gap-item {
    width: 100%;
    text-align: left;
    cursor: pointer;
    background: transparent;
    border: 1px dashed var(--line);
    border-radius: var(--r-card);
    padding: 10px 14px;
    font-size: 13.5px;
    color: var(--ink-soft);
  }
  .agenda-gap-item strong { color: var(--ink); font-weight: 700; }

  /* -- Field (single) ------------------------------------------------- */
  .element-nav { display: flex; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
  .ghost-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink-soft);
    border-radius: var(--r-pill);
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .field-head { margin-bottom: 8px; }
  .field-body-full {
    margin-top: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    box-shadow: var(--shadow-card);
    padding: 22px 26px;
    font-size: 16px;
    max-width: 44rem;
  }
  .field-body-full .field-para { margin-bottom: 14px; }

  .stmt-actions { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-left: 6px; vertical-align: middle; }
  .action-btn {
    border-radius: var(--r-pill);
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid var(--action);
  }
  .action-btn-primary {
    background: var(--action);
    color: var(--action-ink);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 2px 4px rgba(25, 60, 49, 0.12);
  }
  .action-btn-primary:hover { background: var(--action-hover); }
  .action-btn-outline { background: transparent; color: var(--action); }
  .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .comment-form {
    margin: 22px 0 0;
    padding: 18px 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    box-shadow: var(--shadow-card);
    max-width: 44rem;
  }
  .comment-form label { display: block; margin-bottom: 10px; font-size: 13px; font-weight: 600; color: var(--ink-soft); }
  .comment-form textarea {
    display: block;
    width: 100%;
    min-height: 4.5rem;
    margin-top: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: var(--r-input);
    padding: 10px 12px;
    font-size: 14px;
    color: var(--ink);
  }
  .comment-form input[type="text"] {
    margin-top: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: var(--r-input);
    padding: 8px 12px;
    font-size: 13px;
    color: var(--ink);
    width: 100%;
    max-width: 24rem;
  }

  /* -- History (was: decision log) ------------------------------------ */
  .history-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; max-width: 44rem; }
  .history-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    box-shadow: var(--shadow-card);
    padding: 14px 18px;
  }
  .history-meta { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 6px; }
  .history-body { margin: 0; color: var(--ink); font-size: 14.5px; }
  /* The notice banner's amber, carried to the entry it is about. */
  .seal-flag { font-size: 12.5px; color: #75500f; margin: 0 0 6px; }
  .notices-banner .seq-link { color: inherit; }
  .seq-link {
    padding: 0;
    background: none;
    border: 0;
    font: inherit;
    color: var(--action);
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
  }

  /* -- Framings (the variant comparison) --------------------------------
     The poster's own cards, one column per framing and one row per field. A
     field whose text differs between framings carries a "Differs" tag and the
     accent edge the poster gives its open field; a field that reads the same
     in every framing loses its shadow and fades to the muted ink. The column
     heads stay in view while the rows scroll, so "Choose" is always at hand. */
  .cmp-grid {
    display: grid;
    grid-template-columns: repeat(var(--k, 3), minmax(15rem, 1fr));
    gap: 6px 12px;
    align-items: stretch;
  }
  /* The margin and padding cancel out, and widen each head's background over
     the column gap so a card scrolling under the heads is not seen between them. */
  .cmp-head { position: sticky; top: 0; z-index: 2; margin: 0 -6px; padding: 0 6px 6px; background: var(--bg); }
  .cmp-head-box {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    box-shadow: var(--shadow-card);
    padding: 10px 16px 12px;
  }
  .cmp-name { font-size: 17px; font-weight: 700; color: var(--ink); }
  .cmp-lens { margin: 0 0 6px; font-size: 13px; color: var(--ink-soft); }
  .cmp-head .action-btn { margin-top: auto; }
  .cmp-row-label {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 6px 0 -2px;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink);
  }
  .cmp-row-caption { font-weight: 400; color: var(--ink-soft); }
  .cmp-card { padding: 12px 14px 10px; gap: 6px; }
  .cmp-diff { box-shadow: var(--shadow-card), inset 3px 0 0 var(--action); }
  .cmp-same { background: transparent; box-shadow: none; }
  .cmp-same .field-lead { color: var(--ink-soft); }
  .diff-tag {
    align-self: flex-start;
    padding: 1px 8px;
    border-radius: var(--r-pill);
    background: var(--accent-surface);
    color: var(--accent-ink);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  .cmp-more { font-size: 13px; }
  .cmp-more summary { cursor: pointer; font-size: 12px; font-weight: 700; color: var(--action); }
  .cmp-more .field-para { margin: 6px 0 0; }
  .choose-note {
    margin: 0 0 12px;
    padding: 8px 12px;
    border-radius: var(--r-input);
    background: var(--suggestion-tint);
    color: var(--suggestion-ink);
    font-size: 13px;
  }

  /* -- Dialogs (accept, choose) ------------------------------------------
     One native <dialog>: modal, focus kept inside, Escape closes it. Drawn
     like the cards: surface, border, card radius, the same shadow. */
  dialog.dlg {
    width: min(36rem, calc(100vw - 32px));
    max-height: calc(100vh - 32px);
    padding: 22px 26px;
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    background: var(--surface);
    color: var(--ink);
    box-shadow: var(--shadow-card), 0 24px 60px rgba(25, 60, 49, 0.25);
    overflow-y: auto;
  }
  dialog.dlg::backdrop { background: rgba(25, 60, 49, 0.35); }
  .dlg h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .dlg-sub { margin: 4px 0 0; font-size: 13.5px; color: var(--ink-soft); }
  .dlg-quote {
    margin: 12px 0 0;
    padding: 8px 12px;
    border-left: 2px solid var(--line);
    background: var(--bg);
    border-radius: 0 var(--r-input) var(--r-input) 0;
    font-size: 14px;
  }
  .dlg label { display: block; margin-top: 14px; font-size: 13px; font-weight: 600; color: var(--ink); }
  .dlg-hint { font-weight: 400; color: var(--ink-soft); }
  .dlg textarea, .dlg input[type="text"] {
    display: block;
    width: 100%;
    margin-top: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: var(--r-input);
    padding: 10px 12px;
    font-size: 14px;
    color: var(--ink);
  }
  .dlg-checks { margin-top: 16px; padding: 10px 14px; border-radius: var(--r-input); background: var(--suggestion-tint); }
  .dlg-checks h3 { font-size: 13px; font-weight: 700; color: var(--suggestion-ink); }
  .dlg-checks ul { margin: 6px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; }
  .dlg-checks .seq { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 700; margin-right: 6px; color: var(--suggestion-ink); }
  .dlg-checks p { margin: 8px 0 0; font-size: 12.5px; color: var(--suggestion-ink); }
  .dlg-error { margin: 12px 0 0; font-size: 13px; font-weight: 700; color: var(--suggestion-ink); }
  .dlg-error:empty { display: none; }
  .dlg-actions { margin-top: 18px; display: flex; justify-content: flex-end; gap: 8px; }
  .dlg-actions .action-btn, .dlg-actions .ghost-btn { padding: 8px 18px; font-size: 13px; }

  /* Point 1: the footer (plugin version, "Canvas after Dorobantu et al.
     2024") is print-only now — it cost about 100px of always-visible screen
     for a credit line, which mattered most at 390px (SQ-111's "half
     screen"). */
  .print-only { display: none; }
  footer { padding: 10px 24px 16px; font-size: 12px; color: var(--ink-soft); }

  .empty-note { color: var(--ink-soft); font-style: italic; font-size: 14px; }

  @media (max-width: 900px) {
    #body-shell { flex-direction: column; }
    #rail {
      flex: 0 0 auto;
      width: 100%;
      border-right: 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      max-height: 220px;
    }
    #body-shell.poster-active #rail,
    #body-shell.compare-active #rail { display: none; }
    .rail-list { flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
    .rail-card { min-width: 190px; flex: 0 0 auto; }
    #stage { padding: 16px; }
    #topbar { padding: 10px 14px; }
    .poster-grid { grid-template-columns: 1fr; }
    .poster-title { font-size: 24px; }
    .field-body-full { padding: 16px 18px; max-width: none; }
    .comment-form { max-width: none; }
  }

  @media print {
    #notice, #topbar, #rail, .action-btn, .comment-form, .stmt-actions,
    .element-nav, .field-foot, .status-tip, .skip-link {
      display: none !important;
    }
    .print-only { display: block !important; }
    html, body, #app, #body-shell, #stage {
      height: auto !important;
      overflow: visible !important;
      display: block !important;
    }
    .view { display: block !important; }
    .field-card, .agenda-item-open { cursor: default; box-shadow: none; }
    body { background: #fff; }
    /* The poster must land on one A4 landscape page (about 1030x700 CSS px
       after the page margin), so its type and spacing shrink for paper. */
    #poster { padding: 0; }
    #poster .poster-head { margin-bottom: 8px; }
    #poster .poster-title { font-size: 22px; }
    #poster .poster-eyebrow { font-size: 11px; }
    #poster .poster-grid { gap: 6px 10px; }
    #poster .poster-row-label { font-size: 10px; margin: 4px 0 -1px; }
    #poster .field-card { padding: 10px 12px 10px; gap: 4px; border-radius: 14px; }
    #poster .field-question { font-size: 13.5px; }
    #poster .field-lead { font-size: 11.5px; line-height: 1.35; }
  }
  @page { size: A4; margin: 2cm; }
  @page poster { size: A4 landscape; margin: 1.2cm; }
  .page-section { break-before: page; margin-bottom: 2rem; }
  #poster { page: poster; }
</style>
</head>
<body>
<a href="#poster" class="skip-link">Skip to poster</a>
<div id="notice" role="alert" hidden>
  <span class="notice-icon" aria-hidden="true">&#9888;</span>
  <span id="notice-text"></span>
  <button type="button" id="notice-dismiss">Dismiss</button>
</div>
<div id="app">
  <p style="padding:24px;">Loading…</p>
</div>
<dialog id="dlg" class="dlg" aria-labelledby="dlg-title"></dialog>
<script>
(function () {
  'use strict';

  // Static copy of the shipped `is-qualitative` profile's dependency graph
  // (plugins/research-harness/references/profiles/is-qualitative.md, "##
  // Dependency graph") — used to find the open field most others depend on.
  var PROFILE_GRAPHS = {
    'is-qualitative': { 1: [], 2: [1, 3], 3: [1], 4: [2, 7], 5: [3, 9], 6: [5], 7: [6], 8: [2, 4, 7], 9: [1, 3] }
  };

  // Daniel's 2026-09-30 direction (SQ-110 comment c_mun9rkzh_c1fd1c, point 1):
  // each of the nine fields is headed by a plain human question; the canvas
  // term goes underneath, small. This is the standard nine-element canvas
  // (references/canvas-elements.md); an element number outside 1-9 falls
  // back to its own title.
  var HUMAN_QUESTIONS = {
    1: 'What puzzles us?',
    2: 'Who cares, and what do they already know?',
    3: 'What exactly do we ask?',
    4: 'What is it made of?',
    5: 'Where do we look?',
    6: 'How do we look?',
    7: 'What did we find?',
    8: 'What does it change?',
    9: 'Where does it stop?'
  };
  var ROW_LABELS = [
    { from: 1, to: 3, label: 'Motivation' },
    { from: 4, to: 6, label: 'Method' },
    { from: 7, to: 9, label: 'Contribution' }
  ];

  // Point 3: status as a soft cue. `stated` is the baseline — plain prose,
  // its word only ever reaches a screen reader. The other three markers get
  // a small, focusable cue: a glyph (never colour alone) plus a word that
  // shows on hover or on keyboard focus.
  var STATUS_WORD = { accepted: 'Decided', stated: 'Said by the authors', tentative: 'Draft', proposed: 'Suggestion' };

  var qs = new URLSearchParams(location.search);
  var fixturePath = qs.get('fixture');
  var fixtureMode = !!fixturePath;

  // The URL carries a single-use code, not the write token. The view trades
  // the code for the token once and keeps the token in this variable only:
  // never in storage, never back in the URL.
  var token = null;
  var sessionCode = null;
  if (!fixtureMode) {
    var m = /(?:^|[#&])c=([0-9a-f]+)/.exec(location.hash);
    sessionCode = m ? m[1] : null;
    history.replaceState(null, '', location.pathname + location.search);
  }
  var LINK_USED = 'This session link was already used. Stop `serve` and start it again.';

  var state = null;
  var activeView = 'poster';
  var app = document.getElementById('app');
  var noticeBox = document.getElementById('notice');
  var noticeText = document.getElementById('notice-text');
  document.getElementById('notice-dismiss').addEventListener('click', function () { noticeBox.hidden = true; });

  function showNotice(msg) {
    noticeText.textContent = msg;
    noticeBox.hidden = false;
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function titleize(slug) {
    return String(slug || '').split(/[-_]+/).filter(Boolean).map(function (w) {
      return w.charAt(0).toUpperCase() + w.slice(1);
    }).join(' ');
  }

  // Point 2: frontmatter.title when the researcher gave one, else the
  // project slug titleized as before.
  function paperTitle(s) {
    var t = s.frontmatter && s.frontmatter.title;
    if (t && String(t).trim()) return String(t).trim();
    return titleize(s.project || (s.frontmatter && s.frontmatter.project) || '') || 'Untitled project';
  }

  // Point 3: "the citekey in the source list" becomes "Gerlach & Cenfetelli
  // 2020" — a citekey of the `author-author-year` or `author-etal-year`
  // shape a researcher's own bibliography tool would produce. A citekey
  // outside that shape (no trailing 4-digit year) is shown as written,
  // because guessing at an unfamiliar convention is worse than the raw key.
  function formatCitekey(key) {
    var parts = String(key).split('-').filter(Boolean);
    var year = parts[parts.length - 1];
    if (!/^\d{4}$/.test(year)) return key;
    var authors = parts.slice(0, -1);
    if (!authors.length) return key;
    var names = authors[authors.length - 1] === 'etal'
      ? titleize(authors[0]) + ' et al.'
      : authors.map(titleize).join(' & ');
    return names + ' ' + year;
  }

  // Extracts the page reference from a statement's `src:` tag so the view
  // never shows the raw tag text (point 4: "no src: text"). Falls back to
  // the whole tag value when no "p. …" portion is present, and handles the
  // `unverified` tag from the sparse fixture. `full` is what the source-key
  // list shows: "Gerlach & Cenfetelli 2020, p. 1706", not the citekey.
  function pageRef(statement) {
    var tag = (statement.tags || [])[0];
    if (!tag) return null;
    if (tag === 'unverified') return { label: 'unverified', full: 'No source found; unverified.' };
    if (tag.indexOf('src:') === 0) {
      var value = tag.slice(4).trim();
      var split = /^([\w-]+)\s+(p\.\s*\S.*)$/.exec(value);
      if (split) {
        return { label: split[2].trim(), full: formatCitekey(split[1]) + ', ' + split[2].trim() };
      }
      var match = /p\.\s*\S.*$/.exec(value);
      return { label: match ? match[0].trim() : value, full: value };
    }
    return { label: tag, full: tag };
  }

  // A log entry body is the entry's text followed by optional labelled lines
  // that hooks/lib/decisions.js writes as `**Why:** …`, `**Explained:** …`,
  // `**Rejected:** …`, `**Open at acceptance:** #a, #b` and `**Supersedes:**
  // #n`. Split those off first, so the main text ends at its own trailing
  // "[marker, src: …]" annotation (the same free-text convention canvas.md
  // uses for statements). That annotation is dropped and only the page
  // reference is kept, quietly, the way a statement's source appears. Text on
  // the lines after a labelled line belongs to that label. The label pattern
  // is the library's (FIELD_RE in hooks/lib/decisions.js), and like the
  // library the page never reads an entry's first line as a label: that line
  // is the researcher's text, whatever it looks like.
  var ENTRY_LABEL = /^\*\*(Why|Explained|Rejected|Open at acceptance|Supersedes):\*\* ?(.*)$/;
  function parseFindingBody(raw) {
    var main = [];
    var notes = [];
    String(raw == null ? '' : raw).split('\n').forEach(function (line, i) {
      var label = i ? ENTRY_LABEL.exec(line) : null;
      if (label) notes.push({ label: label[1], text: label[2].trim() });
      else if (notes.length) notes[notes.length - 1].text = (notes[notes.length - 1].text + ' ' + line.trim()).trim();
      else main.push(line);
    });
    var text = main.join('\n').trim();
    var m = /\s*\[([^\]]*)\]\s*$/.exec(text);
    if (!m) return { text: text, pageRef: null, notes: notes };
    var pageMatch = /p\.\s*\S.*$/.exec(m[1]);
    return { text: text.slice(0, m.index).trim(), pageRef: pageMatch ? pageMatch[0].trim() : null, notes: notes };
  }

  // One rendering of a log entry body for every reading view: the main text
  // with its page as a superscript, then each labelled line as a quiet second
  // line ("Why: …") in the muted colour. No raw markers, no asterisks.
  function renderEntryBody(raw) {
    var parsed = parseFindingBody(raw);
    return esc(parsed.text)
      + (parsed.pageRef ? ' <sup class="src-ref">' + esc(parsed.pageRef) + '</sup>' : '')
      + parsed.notes.map(function (n) {
        return '<span class="entry-note">' + esc(n.label) + ': '
          + (n.label === 'Open at acceptance' ? seqLinks(n.text) : esc(n.text)) + '</span>';
      }).join('');
  }

  // "#4, #7" as links that open the History entry with that number.
  function seqLinks(text) {
    return esc(text).replace(/#(\d+)/g, function (all, n) {
      return '<button type="button" class="seq-link" data-view-target="log" data-scroll-to="entry-' + n + '">#' + n + '</button>';
    });
  }

  // The open field most others depend on, transitively, per SQ-83's recon:
  // combine open/closed status with the profile's dependency graph and pick
  // the open field with the largest transitive dependent set.
  function computeAccent(elements, graph) {
    if (!graph) return null;
    var reverse = {};
    Object.keys(graph).forEach(function (n) { reverse[n] = reverse[n] || []; });
    Object.keys(graph).forEach(function (n) {
      graph[n].forEach(function (dep) {
        reverse[dep] = reverse[dep] || [];
        reverse[dep].push(Number(n));
      });
    });
    function transitiveDependents(n) {
      var seen = new Set();
      var stack = (reverse[n] || []).slice();
      while (stack.length) {
        var cur = stack.pop();
        if (seen.has(cur)) continue;
        seen.add(cur);
        (reverse[cur] || []).forEach(function (x) { if (!seen.has(x)) stack.push(x); });
      }
      return seen.size;
    }
    var best = null;
    var bestCount = 0;
    elements.forEach(function (e) {
      if (e.status.status === 'accepted') return;
      var c = transitiveDependents(e.number);
      if (c > bestCount) { bestCount = c; best = e.number; }
    });
    return best;
  }

  function findingsFor(decisions, number) {
    return decisions.filter(function (d) {
      if (d.kind !== 'DISCOVERY') return false;
      var found = /^(\d+)/.exec(d.ref || '');
      return found && Number(found[1]) === number;
    });
  }

  // Point 2: the poster card's headline is "the first statement that is not
  // a suggestion" — the paper's own voice, not a Claude paraphrase, even
  // when the very first statement in document order happens to be
  // `[proposed]` (element 1's 1.1 in the exemplar). If a field has nothing
  // but suggestions, the lead falls back to the first statement there is,
  // flagged so the card can still render it as a quiet idea rather than a
  // false headline.
  function leadStatementFor(e) {
    var fallback = null;
    for (var qi = 0; qi < e.questions.length; qi += 1) {
      var q = e.questions[qi];
      for (var si = 0; si < q.statements.length; si += 1) {
        var st = q.statements[si];
        if (!fallback) fallback = { statement: st, question: q };
        if (st.marker !== 'proposed') return { statement: st, question: q, isIdea: false };
      }
    }
    return fallback ? { statement: fallback.statement, question: fallback.question, isIdea: true } : null;
  }

  // Point 3: a DISCOVERY/History entry's `ref` is "5 Research Setting" (the
  // canvas element number and its category); the reading views show the
  // human question that element answers instead.
  function refToQuestion(ref) {
    var m = /^(\d+)/.exec(ref || '');
    var n = m && Number(m[1]);
    return (n && HUMAN_QUESTIONS[n]) || ref;
  }

  // Point 6: the questions nobody has answered yet, across every field —
  // what "To talk about" adds to the fields that already have a finding.
  function gapQuestions(s) {
    var gaps = [];
    s.elements.forEach(function (e) {
      e.questions.forEach(function (q) {
        if (!q.statements.length) gaps.push({ element: e, question: q });
      });
    });
    return gaps;
  }

  // Renders one statement as a prose span. `full` (field view) adds a
  // focusable status cue whose word appears on hover or keyboard focus, plus
  // the accept/mark-as-said actions. Point 5: a suggestion carries one
  // visible "Idea" label and nothing else names it, so it is announced once,
  // not twice (point 8).
  function renderStatement(s, opts) {
    var text = esc(s.text);
    var cls = ['stmt'];
    if (s.marker) cls.push('stmt-' + s.marker);
    var inner;
    var word = STATUS_WORD[s.marker];
    if (s.marker === 'proposed') {
      inner = '<span class="idea-tag">Idea</span>' + text;
    } else if (s.marker === 'accepted' || s.marker === 'tentative') {
      var glyph = s.marker === 'accepted' ? '&#10003;' : '&#9675;';
      inner = '<span class="sr-only">' + esc(word) + '. </span>' + text
        + (opts.full
          ? '<span class="status-cue status-cue-' + s.marker + '" tabindex="0" aria-label="' + esc(word) + '">'
            + '<span class="status-glyph" aria-hidden="true">' + glyph + '</span>'
            + '<span class="status-tip" aria-hidden="true">' + esc(word) + '</span></span>'
          : '<span class="status-glyph" aria-hidden="true">' + glyph + '</span>');
    } else {
      // stated, or a statement with no marker at all: plain prose.
      inner = (word ? '<span class="sr-only">' + esc(word) + '. </span>' : '') + text;
    }

    var refHtml = '';
    if (opts.footnotes) {
      var ref = pageRef(s);
      if (ref) {
        opts.footnotes.push(ref);
        var idx = opts.footnotes.length;
        refHtml = opts.linked
          ? ' <sup class="src-ref"><a href="#src-' + opts.elementNumber + '-' + idx + '" id="srcref-' + opts.elementNumber + '-' + idx + '">' + esc(ref.label) + '</a></sup>'
          : ' <sup class="src-ref">' + esc(ref.label) + '</sup>';
      }
    }

    var actionsHtml = '';
    if (opts.full && !fixtureMode) {
      var actions = [];
      if (['proposed', 'tentative', 'stated'].indexOf(s.marker) !== -1) {
        actions.push('<button type="button" class="action-btn action-btn-primary" data-action="accept" data-question="' + esc(opts.questionId) + '" data-hash="' + esc(s.hash) + '">Accept&hellip;</button>');
      }
      if (['proposed', 'tentative'].indexOf(s.marker) !== -1) {
        actions.push('<button type="button" class="action-btn action-btn-outline" data-action="stated" data-question="' + esc(opts.questionId) + '" data-hash="' + esc(s.hash) + '">Mark as said</button>');
      }
      if (actions.length) actionsHtml = '<span class="stmt-actions">' + actions.join('') + '</span>';
    }

    return '<span class="' + cls.join(' ') + '">' + inner + '</span>' + refHtml + actionsHtml;
  }

  // The full field view's prose renderer: one paragraph per statement, so a
  // suggestion's quiet idea note (point 5) never glues onto an authors'
  // sentence the way the old single-paragraph-per-question layout did. The
  // question id (1.1 … 9.3) is kept as the paragraph's own `id`, an anchor a
  // reader can still link to, but not as visible text (point 3); an empty
  // question shows itself plus "Not answered yet", never a dashed error
  // look.
  function renderFieldBody(e, opts) {
    var footnotes = opts.linked ? [] : null;
    var paras = e.questions.map(function (q) {
      if (!q.statements.length) {
        return '<p class="field-para field-gap" id="q-' + esc(q.id) + '" data-qid="' + esc(q.id) + '">'
          + '<span class="field-gap-question">' + esc(q.text) + '</span> '
          + '<span class="field-gap-note">Not answered yet.</span></p>';
      }
      return q.statements.map(function (s, i) {
        var body = renderStatement(s, {
          full: opts.linked,
          linked: opts.linked,
          footnotes: footnotes,
          elementNumber: e.number,
          questionId: q.id
        });
        var paraClasses = ['field-para'];
        if (s.marker === 'proposed') paraClasses.push('field-para-idea');
        return '<p class="' + paraClasses.join(' ') + '" id="q-' + esc(q.id) + (i ? '-' + i : '') + '" data-qid="' + esc(q.id) + '">' + body + '</p>';
      }).join('');
    }).join('');
    return { html: paras, footnotes: footnotes || [] };
  }

  // Point 1: the field is headed by the plain human question, in large
  // type; the canvas term sits under it, small — kept here because this is
  // the element view, the one place point 3 still allows it.
  function fieldHeader(e, big) {
    return '<' + (big ? 'h1' : 'span') + ' class="field-question' + (big ? ' field-question-lg' : '') + '">'
      + esc(HUMAN_QUESTIONS[e.number] || e.title) + '</' + (big ? 'h1' : 'span') + '>'
      + '<span class="field-eyebrow"><span class="num-badge" aria-hidden="true">' + e.number + '</span>'
      + '<span class="field-term">' + esc(e.title) + '</span></span>';
  }

  // The paper's title is the poster's large heading and appears nowhere else
  // in the chrome; the bar carries only the brand and the three views.
  function renderTopbar(s) {
    return '<header id="topbar">'
      + '<div id="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>'
      + '<span class="brand-text">Research harness <span class="brand-sep">/</span> Canvas</span></div>'
      + '<nav id="view-tabs" aria-label="Views">'
      + tabButton('poster', 'Poster')
      + (variantsOf(s).length ? tabButton('compare', 'Framings') : '')
      + tabButton('agenda', 'To talk about')
      + tabButton('log', 'History')
      + '</nav>'
      + '</header>';
  }

  function tabButton(view, label) {
    return '<button type="button" class="segment" data-view-target="' + view + '" aria-pressed="false">' + esc(label) + '</button>';
  }

  function renderRail(s) {
    var elements = s.elements;
    var graph = (s.frontmatter && PROFILE_GRAPHS[s.frontmatter.profile]) || null;
    var accent = s.profileError ? null : computeAccent(elements, graph);
    var cards = elements.map(function (e) {
      var totalk = findingsFor(s.decisions, e.number).length;
      var classes = ['rail-card'];
      if (accent === e.number) classes.push('rail-card-accent');
      return '<li><button type="button" class="' + classes.join(' ') + '" data-view-target="element-' + e.number + '">'
        + '<span class="rail-top"><span class="num-badge">' + e.number + '</span>'
        + '<span class="rail-question">' + esc(HUMAN_QUESTIONS[e.number] || e.title) + '</span>'
        + (totalk ? '<span class="rail-totalk-badge"><span aria-hidden="true">' + totalk + '</span><span class="sr-only"> to talk about</span></span>' : '')
        + '</span>'
        + '<span class="rail-term">' + esc(e.title) + '</span>'
        + '</button></li>';
    }).join('');
    return '<nav id="rail" aria-label="Fields overview"><p class="rail-label">Fields</p><ol class="rail-list">' + cards + '</ol></nav>';
  }

  // Point 1/8: one card, one heading, one complete lead sentence in the
  // authors' own voice (point 2), one "More" link — not a button wrapping
  // the whole card. The row label is now its own grid item (see the CSS
  // comment), so it genuinely spans the row instead of only sitting inside
  // the first card.
  function renderPosterCard(e, accent, totalkCount) {
    var question = HUMAN_QUESTIONS[e.number] || e.title;
    var lead = leadStatementFor(e);
    var classes = ['field-card'];
    if (accent === e.number) classes.push('field-card-accent');
    var leadHtml;
    if (lead) {
      var leadClasses = ['field-lead'];
      if (lead.isIdea) leadClasses.push('field-para-idea');
      var leadTag = lead.isIdea ? '<span class="idea-tag">Idea</span>' : '';
      leadHtml = '<p class="' + leadClasses.join(' ') + '">' + leadTag + esc(lead.statement.text) + '</p>';
    } else {
      leadHtml = '<p class="field-lead field-gap-note">Not answered yet.</p>';
    }
    return '<li class="poster-cell">'
      + '<article class="' + classes.join(' ') + '">'
      + '<span class="field-eyebrow" aria-hidden="true"><span class="num-badge">' + e.number + '</span></span>'
      + '<h3 class="field-question">' + esc(question) + '</h3>'
      + leadHtml
      + '<div class="field-foot">'
      + '<button type="button" class="field-more" data-view-target="element-' + e.number + '">More<span class="sr-only"> about ' + esc(question) + '</span></button>'
      + (totalkCount
          ? '<button type="button" class="field-totalk" data-view-target="agenda" data-scroll-to="agenda-field-' + e.number + '">'
            + totalkCount + (totalkCount === 1 ? ' thing' : ' things') + ' to talk about<span class="sr-only">, ' + esc(question) + '</span> <span aria-hidden="true">&rarr;</span></button>'
          : '')
      + '</div>'
      + '</article></li>';
  }

  // The poster: the whole paper on one screen, argument order, print-only
  // footer, no side rail (both hidden by CSS while this view is active).
  function renderPoster(s) {
    var elements = s.elements;
    var graph = (s.frontmatter && PROFILE_GRAPHS[s.frontmatter.profile]) || null;
    var accent = s.profileError ? null : computeAccent(elements, graph);
    var outlet = s.frontmatter && s.frontmatter.outlet;

    var cells = [];
    elements.forEach(function (e) {
      var rowLabel = ROW_LABELS.filter(function (r) { return r.from === e.number; })[0];
      if (rowLabel) cells.push('<li class="poster-row-label" aria-hidden="true">' + esc(rowLabel.label) + '</li>');
      cells.push(renderPosterCard(e, accent, agendaFindings(s, e).length));
    });

    return '<section id="poster" data-view="poster" class="view page-section" tabindex="-1">'
      + '<div class="poster-head">'
      + (outlet ? '<p class="poster-eyebrow">' + esc(outlet) + '</p>' : '')
      + '<h1 class="poster-title">' + esc(paperTitle(s)) + '</h1>'
      + '</div>'
      + '<ol class="poster-grid">' + cells.join('') + '</ol>'
      + '</section>';
  }

  // -- Framings -------------------------------------------------------
  // The project's variants, each a whole canvas state of its own (GET
  // /api/state: `variants: [{name, lens, state}]`). An older payload has none.
  function variantsOf(s) { return (s && s.variants) || []; }

  function variantElement(v, number) {
    return v.state.elements.filter(function (e) { return e.number === number; })[0] || null;
  }

  // What a field says, for comparing: each question's statements, text only,
  // whitespace collapsed. Markers and sources are not compared — a field worded
  // alike does not differ, and one worded differently does, whatever either
  // calls it.
  function fieldSignature(e) {
    if (!e) return '';
    return e.questions.map(function (q) {
      return q.id + ':' + q.statements.map(function (st) { return String(st.text).replace(/\s+/g, ' ').trim(); }).join('|');
    }).join('\n');
  }

  function fieldDiffers(variants, number) {
    var seen = {};
    variants.forEach(function (v) { seen[fieldSignature(variantElement(v, number))] = true; });
    return Object.keys(seen).length > 1;
  }

  // The server's own default for what a choice sets aside: the other
  // framings' names with their lenses (hooks/lib/choose.js), prefilled in the
  // dialog and editable there.
  function defaultRejected(variants, name) {
    return variants.filter(function (v) { return v.name !== name; }).map(function (v) {
      return v.lens ? v.name + ' (lens: ' + v.lens + ')' : v.name;
    }).join('; ');
  }

  // Why choosing is off, in one line, or null. The library refuses while the
  // main canvas holds an [accepted] statement (a framing is chosen before
  // anything is accepted) or a [stated] one (a choice would delete the authors'
  // own words). Saying so here saves the round trip; if the server still
  // refuses, its message is shown as it is.
  function chooseBlock(s) {
    var accepted = [];
    var stated = [];
    s.elements.forEach(function (e) {
      e.questions.forEach(function (q) {
        q.statements.forEach(function (st) {
          if (st.marker === 'accepted' && accepted.indexOf(q.id) === -1) accepted.push(q.id);
          if (st.marker === 'stated' && stated.indexOf(q.id) === -1) stated.push(q.id);
        });
      });
    });
    var parts = [];
    var why = [];
    if (accepted.length) {
      parts.push(accepted.length + ' accepted (' + accepted.join(', ') + ')');
      why.push('A framing is chosen before anything is accepted.');
    }
    if (stated.length) {
      parts.push(stated.length + ' said by the authors (' + stated.join(', ') + ')');
      why.push('A choice would replace what the authors said.');
    }
    if (!parts.length) return null;
    return 'Choosing is off: the main canvas already holds ' + parts.join(' and ') + '. ' + why.join(' ');
  }

  function renderCompareCard(v, e, differs, several) {
    var ve = variantElement(v, e.number);
    var question = HUMAN_QUESTIONS[e.number] || e.title;
    var lead = ve ? leadStatementFor(ve) : null;
    var all = [];
    if (ve) ve.questions.forEach(function (q) { all = all.concat(q.statements); });
    var classes = ['field-card', 'cmp-card'];
    if (differs) classes.push('cmp-diff');
    else if (several) classes.push('cmp-same');
    var leadHtml = lead
      ? '<p class="field-lead' + (lead.isIdea ? ' field-para-idea' : '') + '">' + (lead.isIdea ? '<span class="idea-tag">Idea</span>' : '') + esc(lead.statement.text) + '</p>'
      : '<p class="field-lead field-gap-note">Not answered yet.</p>';
    // The card leads with one sentence, like the poster; a difference can sit
    // in a statement below it, so every statement of the field is one click away.
    var more = all.length > 1
      ? '<details class="cmp-more"><summary>All ' + all.length + ' statements<span class="sr-only"> of ' + esc(v.name) + ' on ' + esc(question) + '</span></summary>'
        + all.map(function (st) {
          return '<p class="field-para' + (st.marker === 'proposed' ? ' field-para-idea' : '') + '">'
            + (st.marker === 'proposed' ? '<span class="idea-tag">Idea</span>' : '') + esc(st.text) + '</p>';
        }).join('') + '</details>'
      : '';
    return '<article class="' + classes.join(' ') + '">'
      + '<span class="sr-only">' + esc(v.name) + ', ' + esc(question) + (differs ? ', differs from the other framings' : '') + '. </span>'
      + (differs ? '<span class="diff-tag" aria-hidden="true">Differs</span>' : '')
      + leadHtml + more
      + '</article>';
  }

  // The poster's cards, one column per framing and one row per field, each
  // column headed by the framing's name and lens, with the action that chooses
  // it. Nothing here edits a statement: the view only reads them.
  function renderCompare(s) {
    var variants = variantsOf(s);
    if (!variants.length) return '';
    var several = variants.length > 1;
    var blocked = chooseBlock(s);
    var heads = variants.map(function (v) {
      return '<div class="cmp-head"><div class="cmp-head-box">'
        + '<h3 class="cmp-name">' + esc(v.name) + '</h3>'
        + '<p class="cmp-lens">' + (v.lens ? 'Lens: ' + esc(v.lens) : 'No lens recorded') + '</p>'
        + '<button type="button" class="action-btn action-btn-primary" data-action="choose" data-variant="' + esc(v.name) + '"'
        + (blocked ? ' disabled aria-describedby="choose-note"' : '') + '>Choose this framing<span class="sr-only">: ' + esc(v.name) + '</span></button>'
        + '</div></div>';
    }).join('');
    var rows = s.elements.map(function (e) {
      var differs = several && fieldDiffers(variants, e.number);
      return '<h3 class="cmp-row-label"><span class="num-badge" aria-hidden="true">' + e.number + '</span>' + esc(HUMAN_QUESTIONS[e.number] || e.title)
        + (several ? '<span class="cmp-row-caption">&middot; ' + (differs ? 'differs between framings' : 'the same in every framing') + '</span>' : '') + '</h3>'
        + variants.map(function (v) { return renderCompareCard(v, e, differs, several); }).join('');
    }).join('');
    return '<section id="compare" data-view="compare" class="view page-section">'
      + '<div class="view-head"><h2>Framings</h2><p class="view-sub">The same paper read through each lens. Fields that differ are marked; the rest are faded. Choosing one makes it the main canvas and keeps the others as the record.</p></div>'
      + (blocked ? '<p class="choose-note" id="choose-note">' + esc(blocked) + '</p>' : '')
      + '<div class="cmp-grid" style="--k:' + variants.length + '">' + heads + rows + '</div>'
      + '</section>';
  }

  function renderField(e, total) {
    // Sources and the status-cue words read the same way in fixture mode;
    // only the write actions (accept/mark-as-said) depend on `fixtureMode`,
    // gated separately inside renderStatement.
    var body = renderFieldBody(e, { linked: true });
    var sourceKey = body.footnotes.length
      ? '<div class="source-key-wrap"><ol class="source-key">' + body.footnotes.map(function (ref, i) {
          return '<li id="src-' + e.number + '-' + (i + 1) + '">' + (ref.full ? esc(ref.full) : '—') + ' <a href="#srcref-' + e.number + '-' + (i + 1) + '">&#8617;</a></li>';
        }).join('') + '</ol></div>'
      : '';

    var totalkRaw = findingsFor(state.decisions, e.number);
    var totalkFull = totalkRaw.length
      ? '<div class="field-totalk-full"><h3 class="view-sub" style="color:var(--ink);font-weight:700;">To talk about</h3>'
        + '<ul class="totalk-list">' + totalkRaw.map(function (d) {
          return '<li class="totalk-item">' + renderEntryBody(d.body) + '</li>';
        }).join('') + '</ul></div>'
      : '';

    var commentForm = fixtureMode
      ? '<p class="empty-note">Actions are disabled in fixture mode.</p>'
      : '<div class="comment-form">'
        + '<label>Something to talk about? Add a note for the meeting.<textarea data-comment-body-for="' + e.number + '"></textarea></label>'
        + '<label>Why (optional) <input type="text" data-comment-why-for="' + e.number + '"></label>'
        + '<button type="button" class="action-btn action-btn-primary" data-action="comment" data-element="' + e.number + '" data-element-title="' + esc(e.title) + '">Add a note</button>'
        + '</div>';

    var nav = '<div class="element-nav">'
      + (e.number > 1 ? '<button type="button" class="ghost-btn" data-view-target="element-' + (e.number - 1) + '">&larr; Previous field</button>' : '<span></span>')
      + (e.number < total ? '<button type="button" class="ghost-btn" data-view-target="element-' + (e.number + 1) + '">Next field &rarr;</button>' : '<span></span>')
      + '</div>';

    return '<section id="element-' + e.number + '" data-view="element-' + e.number + '" class="view page-section field-view">'
      + nav
      + '<div class="view-head field-head">' + fieldHeader(e, true) + '</div>'
      + '<div class="field-body-full">' + body.html + '</div>'
      + sourceKey
      + totalkFull
      + commentForm
      + '</section>';
  }

  // The findings "To talk about" lists for a field: none once the field is
  // accepted. The poster chip counts exactly these, so it never points at an
  // empty spot in that tab.
  function agendaFindings(s, e) {
    return e.status.status === 'accepted' ? [] : findingsFor(s.decisions, e.number);
  }

  // Point 6: "To talk about" is a meeting starter, not a nine-row form — it
  // lists only fields that actually have a finding, plus the questions
  // nobody has answered yet, named by the field's human question.
  function renderAgenda(s) {
    var items = s.elements.map(function (e) {
      var findings = agendaFindings(s, e);
      if (!findings.length) return '';
      return '<li id="agenda-field-' + e.number + '" tabindex="-1"><button type="button" class="agenda-item-open" data-view-target="element-' + e.number + '">'
        + '<span class="agenda-item-head"><span class="num-badge">' + e.number + '</span>'
        + '<span class="agenda-item-title">' + esc(HUMAN_QUESTIONS[e.number] || e.title) + '</span></span>'
        + '<ul class="agenda-findings">' + findings.map(function (d) {
            return '<li>' + renderEntryBody(d.body) + '</li>';
          }).join('') + '</ul>'
        + '</button></li>';
    }).join('');

    var gapItems = gapQuestions(s).map(function (g) {
      var question = HUMAN_QUESTIONS[g.element.number] || g.element.title;
      return '<li><button type="button" class="agenda-gap-item" data-view-target="element-' + g.element.number + '">'
        + 'Not answered yet: <strong>' + esc(question) + '</strong> &mdash; ' + esc(g.question.text)
        + '</button></li>';
    }).join('');

    var sections = '';
    if (items) sections += '<ul class="agenda-list">' + items + '</ul>';
    if (gapItems) {
      sections += '<h3 class="view-sub" style="color:var(--ink);font-weight:700;margin-top:20px;">Not answered yet</h3>'
        + '<ul class="agenda-gap-list">' + gapItems + '</ul>';
    }
    if (!sections) sections = '<p class="empty-note">Nothing to talk about right now.</p>';

    return '<section id="agenda" data-view="agenda" class="view page-section">'
      + '<div class="view-head"><h2>To talk about</h2><p class="view-sub">Where the meeting starts.</p></div>'
      + sections
      + '</section>';
  }

  function historyLabel(kind) {
    if (kind === 'DISCOVERY') return 'To talk about';
    if (kind === 'CONSTRAINT') return 'Constraint';
    if (kind === 'DECISION') return 'Decision';
    return kind ? (kind.charAt(0) + kind.slice(1).toLowerCase()) : 'Entry';
  }

  // The entry hooks/lib/choose.js writes when the researcher picks a framing:
  // a DECISION whose ref is `framing chosen: <variant name>`.
  var FRAMING_REF = /^framing chosen: (.+)$/;

  // Each entry carries its `#seq`: "Open at acceptance" names entries by it,
  // and its links land on the card with that id.
  // What the server's seal check says about one entry (sealStatus, the verdicts
  // of hooks/lib/review.js), in the words `review` uses. Every card names it.
  var SEAL_STATE = { verified: 'verified', broken: 'broken', legacy: 'legacy (no seal)', unverifiable: 'unverifiable here' };
  var BREAK_WHY = {
    unsealed: 'an unsealed entry follows a sealed one',
    anchor: 'its own content or the unsealed block before it changed',
    chain: 'entries before it are missing or were removed',
    content: 'its own heading or body changed'
  };

  function brokenAt(s) {
    var ledger = s.review && s.review.ledger;
    return ledger && ledger.status === 'broken' && ledger.broken ? ledger.broken : null;
  }

  // A DECISION that does not verify is marked in words, not only in colour: a
  // forged `framing chosen` or accept must not read like the researcher's own.
  function sealFlag(d, s) {
    if (d.kind !== 'DECISION' || !d.sealStatus || d.sealStatus === 'verified') return '';
    var at = brokenAt(s);
    var why = d.sealStatus === 'legacy' ? 'it was written before entries were sealed'
      : d.sealStatus === 'broken' ? (at && at.seq === d.seq ? 'the log breaks here: ' + (BREAK_WHY[at.why] || 'its seal fails') : 'it comes after the break' + (at ? ' at #' + at.seq : ''))
      : 'it cannot be checked on this machine';
    return '<p class="seal-flag" role="note"><span aria-hidden="true">&#9888;</span> Does not verify: ' + esc(why) + '.</p>';
  }

  function renderHistory(s) {
    var rows = s.decisions.map(function (d) {
      var framing = d.kind === 'DECISION' ? FRAMING_REF.exec(d.ref || '') : null;
      return '<li class="history-card" id="entry-' + esc(d.seq) + '" tabindex="-1"><p class="history-meta">#' + esc(d.seq) + ' &middot; '
        + esc(framing ? 'Framing chosen' : historyLabel(d.kind)) + ' &middot; ' + esc(d.date) + ' &middot; ' + esc(framing ? framing[1] : refToQuestion(d.ref))
        + (SEAL_STATE[d.sealStatus] ? ' &middot; ' + esc(SEAL_STATE[d.sealStatus]) : '') + '</p>'
        + sealFlag(d, s)
        + '<p class="history-body">' + renderEntryBody(d.body) + '</p>'
        + '</li>';
    }).join('');
    return '<section id="log" data-view="log" class="view page-section">'
      + '<div class="view-head"><h2>History</h2><p class="view-sub">What has been said and decided, in order.</p></div>'
      + (rows ? '<ol class="history-list">' + rows + '</ol>' : '<p class="empty-note">Nothing yet.</p>')
      + '</section>';
  }

  function renderFooter(s) {
    return '<footer class="page-section print-only"><p>research-harness ' + esc(s.version || 'unknown') + ' &middot; Canvas after Dorobantu et al. 2024</p></footer>';
  }

  function renderStagePanels(s) {
    return renderPoster(s) + renderCompare(s) + renderAgenda(s) + s.elements.map(function (e) { return renderField(e, s.elements.length); }).join('') + renderHistory(s);
  }

  function render() {
    // The Framings tab exists while the project holds variants; once the last
    // one is gone a reload must not leave the reader on a view with no tab.
    if (activeView === 'compare' && !variantsOf(state).length) activeView = 'poster';
    app.innerHTML = renderTopbar(state)
      + renderNotices(state)
      + '<div id="body-shell">' + renderRail(state) + '<main id="stage">' + renderStagePanels(state) + '</main></div>'
      + renderFooter(state);
    applyActiveView();
  }

  function renderNotices(s) {
    var notices = [];
    if (s.profileError) notices.push('<p>Profile: ' + esc(s.profileError) + '</p>');
    if (s.keyError) notices.push('<p>Sealing key: ' + esc(s.keyError) + '</p>');
    var broken = brokenAt(s);
    if (broken) {
      notices.push('<p>Decision log: does not verify. It breaks at <button type="button" class="seq-link" data-view-target="log" data-scroll-to="entry-' + esc(broken.seq) + '">#' + esc(broken.seq) + '</button> ('
        + esc(BREAK_WHY[broken.why] || 'its seal fails') + '). Every entry from there on is marked in History. The harness never repairs a log.</p>');
    }
    if (!notices.length) return '';
    return '<div class="notices-banner" role="alert">' + notices.join('') + '</div>';
  }

  function applyActiveView() {
    var views = app.querySelectorAll('.view');
    for (var i = 0; i < views.length; i++) {
      views[i].classList.toggle('active', views[i].getAttribute('data-view') === activeView);
    }
    // Point 1: the side rail is poster-only hidden; every other view keeps
    // it as the way to get from one field to another.
    var shell = document.getElementById('body-shell');
    if (shell) {
      shell.classList.toggle('poster-active', activeView === 'poster');
      shell.classList.toggle('compare-active', activeView === 'compare');
    }
    var tabs = app.querySelectorAll('.segment');
    for (i = 0; i < tabs.length; i++) {
      var tabMatch = tabs[i].getAttribute('data-view-target') === activeView;
      tabs[i].classList.toggle('active', tabMatch);
      tabs[i].setAttribute('aria-pressed', tabMatch ? 'true' : 'false');
    }
    var railCards = app.querySelectorAll('.rail-card');
    for (i = 0; i < railCards.length; i++) {
      var railMatch = railCards[i].getAttribute('data-view-target') === activeView;
      railCards[i].classList.toggle('active', railMatch);
      if (railMatch) railCards[i].setAttribute('aria-current', 'true');
      else railCards[i].removeAttribute('aria-current');
    }
  }

  function fetchState() {
    var url = fixtureMode ? fixturePath : '/api/state';
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error('failed to load state (' + r.status + ')');
      return r.json();
    });
  }

  function refreshState() {
    return fetchState().then(function (s) { state = s; render(); });
  }

  function post(path, payload) {
    return fetch(path, {
      method: 'POST',
      headers: { 'X-Harness-Token': token || '', 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (json) { return { status: r.status, json: json }; });
    });
  }

  // Trades the code from the URL for the write token. A refusal means someone
  // else redeemed the code first (or it expired, or this is a reload): the
  // human has to see that, not a view that silently cannot write.
  function openSession() {
    if (!sessionCode) { showNotice(LINK_USED); return; }
    post('/api/session', { code: sessionCode }).then(function (res) {
      if (res.status === 200 && res.json && res.json.ok && res.json.token) token = res.json.token;
      else showNotice(LINK_USED);
    }).catch(function (err) {
      showNotice('Could not open the session: ' + err.message);
    });
    sessionCode = null;
  }

  function doPost(path, payload) {
    if (!token) { showNotice(LINK_USED); return; }
    post(path, payload).then(function (res) {
      if (res.status === 200 && res.json && res.json.ok) {
        return refreshState();
      }
      if (res.status === 409) {
        showNotice('The canvas changed since this view loaded; reloading.');
        return refreshState();
      }
      showNotice((res.json && res.json.error) || ('Request failed (' + res.status + ').'));
    }).catch(function (err) {
      showNotice('Request failed: ' + err.message);
    });
  }

  // -- Dialogs ----------------------------------------------------------
  // Accept and choose each ask for a sentence of the researcher's own, so both
  // go through the one <dialog>. The dialog shows what the server answered
  // when it refuses (a label line in the text, a [stated] statement in the
  // way) inside itself: the notice bar sits under a modal dialog.
  var dlg = document.getElementById('dlg');
  var dialogState = null;
  var dialogBusy = false;

  function findStatement(s, questionId, hash) {
    for (var i = 0; i < s.elements.length; i++) {
      var qs2 = s.elements[i].questions;
      for (var j = 0; j < qs2.length; j++) {
        if (qs2[j].id !== questionId) continue;
        for (var k = 0; k < qs2[j].statements.length; k++) {
          if (qs2[j].statements[k].hash === hash) return { question: qs2[j], statement: qs2[j].statements[k] };
        }
      }
    }
    return null;
  }

  function showDialog(markup, what) {
    dialogState = what;
    dialogBusy = false;
    dlg.innerHTML = markup;
    if (!dlg.open) dlg.showModal();
  }

  function closeDialog() {
    if (dlg.open) dlg.close();
    dialogState = null;
  }

  function dialogError(message) {
    var box = dlg.querySelector('.dlg-error');
    if (box) box.textContent = message;
  }

  function dialogButtons(confirmLabel) {
    return '<p class="dlg-error" role="alert"></p>'
      + '<div class="dlg-actions"><button type="button" class="ghost-btn" data-dlg="cancel">Cancel</button>'
      + '<button type="submit" class="action-btn action-btn-primary">' + esc(confirmLabel) + '</button></div>';
  }

  // The accept dialog: the statement as it stands (never editable here), the
  // one required sentence, and the check questions still open on its question,
  // each with the `#seq` of the log entry that asked it. Accepting with some
  // open is allowed, so the button says so; the log records which were open.
  function openAcceptDialog(questionId, hash) {
    var found = findStatement(state, questionId, hash);
    if (!found) {
      showNotice('That statement is no longer on the canvas; reloading.');
      refreshState();
      return;
    }
    var checks = found.question.openChecks || [];
    var checksHtml = checks.length
      ? '<section class="dlg-checks" aria-labelledby="dlg-checks-title"><h3 id="dlg-checks-title">Open questions from the check</h3>'
        + '<ul>' + checks.map(function (c) { return '<li><span class="seq">#' + esc(c.seq) + '</span>' + esc(c.body) + '</li>'; }).join('') + '</ul>'
        + '<p>You can accept anyway. The record notes which of these were still open.</p></section>'
      : '';
    showDialog('<form id="dlg-form" novalidate>'
      + '<h2 id="dlg-title">Accept this statement</h2>'
      + '<p class="dlg-sub">' + esc(found.question.id) + ' &middot; ' + esc(found.question.text) + '</p>'
      + '<blockquote class="dlg-quote">' + esc(found.statement.text) + '</blockquote>'
      + '<label>In your own words, why does this hold? <span class="dlg-hint">(required, one sentence)</span>'
      + '<textarea name="explained" rows="2" autofocus aria-required="true"></textarea></label>'
      + '<label>Why accept it now? <span class="dlg-hint">(optional)</span><input type="text" name="why"></label>'
      + checksHtml
      + dialogButtons(checks.length ? 'Accept anyway' : 'Accept')
      + '</form>', { kind: 'accept', questionId: questionId, hash: hash });
  }

  // The choose dialog: a required reason, and what is set aside, prefilled
  // with the other framings and their lenses and open to edit.
  function openChooseDialog(name) {
    var variants = variantsOf(state);
    var v = variants.filter(function (x) { return x.name === name; })[0];
    if (!v) return;
    showDialog('<form id="dlg-form" novalidate>'
      + '<h2 id="dlg-title">Choose the &ldquo;' + esc(v.name) + '&rdquo; framing</h2>'
      + '<p class="dlg-sub">' + (v.lens ? 'Lens: ' + esc(v.lens) + '. ' : '') + 'Its statements replace the main canvas. The other framings stay in place as the record of what was compared.</p>'
      + '<label>Why this framing? <span class="dlg-hint">(required)</span>'
      + '<textarea name="why" rows="2" autofocus aria-required="true"></textarea></label>'
      + '<label>What you are setting aside <span class="dlg-hint">(filled in from the other framings; edit as you like)</span>'
      + '<textarea name="rejected" rows="3">' + esc(defaultRejected(variants, v.name)) + '</textarea></label>'
      + dialogButtons('Choose this framing')
      + '</form>', { kind: 'choose', name: v.name });
  }

  function submitDialog(form) {
    var what = dialogState;
    if (!what || dialogBusy) return;
    var field = function (name) { return form.elements[name] ? String(form.elements[name].value).trim() : ''; };
    var payload;
    var path;
    if (what.kind === 'accept') {
      var explained = field('explained');
      if (!explained) { dialogError('Say in your own words why this holds. The record keeps it.'); return; }
      payload = { questionId: what.questionId, expectedHash: what.hash, explained: explained };
      if (field('why')) payload.why = field('why');
      path = '/api/accept';
    } else {
      var why = field('why');
      if (!why) { dialogError('Say why you choose this framing. The record keeps it.'); return; }
      payload = { name: what.name, why: why };
      if (field('rejected')) payload.rejected = field('rejected');
      path = '/api/choose';
    }
    if (fixtureMode) { dialogError('Fixture mode: nothing is written.'); return; }
    if (!token) { dialogError(LINK_USED); return; }
    dialogBusy = true;
    post(path, payload).then(function (res) {
      dialogBusy = false;
      if (res.status === 200 && res.json && res.json.ok) {
        closeDialog();
        // The chosen framing is now the main canvas: show it.
        if (what.kind === 'choose') activeView = 'poster';
        return refreshState();
      }
      if (res.status === 409) {
        closeDialog();
        showNotice('The canvas changed since this view loaded; reloading.');
        return refreshState();
      }
      dialogError((res.json && res.json.error) || ('Request failed (' + res.status + ').'));
    }).catch(function (err) {
      dialogBusy = false;
      dialogError('Request failed: ' + err.message);
    });
  }

  dlg.addEventListener('submit', function (event) {
    event.preventDefault();
    submitDialog(event.target);
  });
  dlg.addEventListener('click', function (event) {
    if (event.target.closest('[data-dlg="cancel"]')) closeDialog();
  });
  dlg.addEventListener('close', function () { dialogState = null; });

  // Fixture mode only: `?view=<view>` and `?dialog=choose:<name>` or
  // `?dialog=accept:<question id>` open a view or a dialog on load, so a
  // screenshot of either needs no click. Nothing is written in fixture mode.
  function openFromUrl() {
    if (!fixtureMode) return;
    var spec = (qs.get('dialog') || '').split(':');
    if (spec[0] === 'choose' && spec[1]) openChooseDialog(spec[1]);
    if (spec[0] === 'accept' && spec[1]) {
      var target = null;
      state.elements.forEach(function (e) {
        e.questions.forEach(function (q) {
          if (q.id !== spec[1]) return;
          q.statements.forEach(function (st) {
            if (!target && ['proposed', 'tentative', 'stated'].indexOf(st.marker) !== -1) target = st;
          });
        });
      });
      if (target) openAcceptDialog(spec[1], target.hash);
    }
  }

  app.addEventListener('click', function (event) {
    // Navigation (view switching) works in fixture mode too: it never writes.
    var navBtn = event.target.closest('[data-view-target]');
    if (navBtn) {
      activeView = navBtn.getAttribute('data-view-target');
      applyActiveView();
      var scrollTo = navBtn.getAttribute('data-scroll-to');
      var target = scrollTo && document.getElementById(scrollTo);
      if (target) {
        target.scrollIntoView({ block: 'start' });
        target.focus({ preventScroll: true });
      }
      return;
    }
    var btn = event.target.closest('button[data-action]');
    if (!btn) return;
    var action = btn.getAttribute('data-action');
    // Both dialogs open in fixture mode too; the confirm button there says
    // nothing is written.
    if (action === 'choose') { openChooseDialog(btn.getAttribute('data-variant')); return; }
    if (fixtureMode) return;
    if (action === 'accept') {
      openAcceptDialog(btn.getAttribute('data-question'), btn.getAttribute('data-hash'));
    } else if (action === 'stated') {
      doPost('/api/stated', { questionId: btn.getAttribute('data-question'), expectedHash: btn.getAttribute('data-hash') });
    } else if (action === 'comment') {
      var num = btn.getAttribute('data-element');
      var title = btn.getAttribute('data-element-title');
      var bodyInput = document.querySelector('[data-comment-body-for="' + num + '"]');
      var whyInput2 = document.querySelector('[data-comment-why-for="' + num + '"]');
      var body = bodyInput ? bodyInput.value.trim() : '';
      if (!body) { showNotice('A note needs some text.'); return; }
      var commentPayload = { ref: num + ' ' + title, body: body };
      var why2 = whyInput2 ? whyInput2.value.trim() : '';
      if (why2) commentPayload.why = why2;
      doPost('/api/comment', commentPayload);
    }
  });

  if (!fixtureMode) openSession();
  if (fixtureMode && qs.get('view')) activeView = qs.get('view');
  refreshState().then(openFromUrl).catch(function (err) {
    app.innerHTML = '<p role="alert" style="padding:24px;">Could not load the canvas: ' + esc(err.message) + '</p>';
  });
})();
</script>
</body>
</html>
